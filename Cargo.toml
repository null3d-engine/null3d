[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/null3d-engine/null3d"
publish = false

[workspace.dependencies]
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
debug = false

# The shader build parses and validates the WGSL of every variant, so its own crates need an
# optimized build. A tool gains nothing from the release profile's link-time optimization or its
# single code unit, so this profile turns both off. It keeps unwinding, so a panic in one compile
# thread reaches the caller instead of ending the process.
[profile.shader]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"

# Development builds optimize the dependencies but not the engine's own crates. The shader tools'
# tests and `bun run shaders` then parse and validate WGSL several times faster, while the engine's
# crates keep their fast rebuilds and full debug information.
[profile.dev.package."*"]
opt-level = 3
