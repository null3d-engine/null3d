<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="data:," />
		<title>null3D and three.js: the CSS3D periodic table</title>
		<style>
			body { margin: 0; background: #000; color: #fff; font-family: Monospace; }
			.stage {
				position: relative;
				width: 960px;
				height: 540px;
				overflow: hidden;
				background: #000;
			}
			.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
			.labels { position: absolute; inset: 0; pointer-events: none; }
			.element {
				width: 120px;
				height: 160px;
				box-shadow: 0px 0px 12px rgba(0, 255, 255, 0.5);
				border: 1px solid rgba(127, 255, 255, 0.25);
				font-family: Helvetica, sans-serif;
				text-align: center;
				line-height: normal;
				cursor: default;
			}
			.element .number {
				position: absolute;
				top: 20px;
				right: 20px;
				font-size: 12px;
				color: rgba(127, 255, 255, 0.75);
			}
			.element .symbol {
				position: absolute;
				top: 40px;
				left: 0px;
				right: 0px;
				font-size: 60px;
				font-weight: bold;
				color: rgba(255, 255, 255, 0.75);
				text-shadow: 0 0 10px rgba(0, 255, 255, 0.95);
			}
			.element .details {
				position: absolute;
				bottom: 15px;
				left: 0px;
				right: 0px;
				font-size: 12px;
				color: rgba(127, 255, 255, 0.75);
			}
		</style>
	</head>
	<body>
		<div class="stage" id="mine">
			<canvas></canvas>
			<div class="labels" id="mine-labels"></div>
		</div>
		<div class="stage" id="theirs"></div>
		<script type="module" src="./css3d-periodictable.ts"></script>
	</body>
</html>
