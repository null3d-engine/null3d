<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>null3d runner</title>
		<style>
			body { margin: 0; font: 14px system-ui, sans-serif; background: #101418; color: #e8e8e8; }
			/* The status line sits above the stage where test pages open, so it never covers a page. */
			#layout { position: fixed; inset: 0; display: flex; flex-direction: column; }
			#status { padding: 4px 8px; background: #000; }
			#stage { position: relative; flex: 1; overflow: auto; }
			#items { margin: 8px; padding: 0; list-style: none; }
			iframe.page { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
		</style>
	</head>
	<body>
		<div id="layout">
			<div id="status">starting</div>
			<div id="stage"><ul id="items"></ul></div>
		</div>
		<script type="module" src="./runner.ts"></script>
	</body>
</html>
