# cargo-nextest runs each test in a process of its own, many at once. The test files that count
# allocations install a counting allocator and measure the engine's job workers too, so each of
# their tests runs with the machine to itself, as under cargo test, where no other test file runs
# beside them. Under the load of other tests, the light grid's allocation test once counted frees
# from job workers that an earlier case had stopped. The counter now stops counting a worker when
# its work returns, and running alone keeps such timing out of these tests.
# These tests run first: a test that needs the whole machine waits until every running test ends,
# and among the others it held back the rest of the run behind each slow test.
[[profile.default.overrides]]
filter = 'binary_id(null3d-render::no_alloc) | binary_id(null3d-core::no_alloc) | binary_id(null3d-core::bvh_no_alloc) | binary_id(null3d-core::arena_soak) | binary_id(null3d-core::depth_sort)'
threads-required = 'num-cpus'
priority = 100

# The one test in this part that builds every shader takes the longest, so it starts next, while
# the many short tests fill the other threads. It builds the whole manifest beside a second build of
# a few entries, one on each of two threads.
[[profile.default.overrides]]
filter = 'binary_id(null3d-shaders::build) & test(=the_repository_build_is_the_same_each_time_and_keeps_every_portability_rule)'
threads-required = 2
priority = 50

# The module exports test builds the few entries that make one module of every kind, which takes
# longer than a short test, so it starts before them.
[[profile.default.overrides]]
filter = 'binary_id(null3d-shaders-wasm) & test(=tests::prepare_modules_lists_every_module_and_module_renders_one)'
priority = 45

# The custom material and effect tests build their templates' variants, which take seconds each.
[[profile.default.overrides]]
filter = 'binary_id(null3d-shaders::material) | binary_id(null3d-shaders::effect) | binary_id(null3d-shaders::pieces)'
priority = 40

# CI runs the test that builds every shader in the shader-compiler job, through the compiler, so
# that it does not set the length of the parts that run all the others. Each profile keeps the
# overrides above. `cargo nextest run --workspace --profile ci` runs every test except that one.
# A test that runs past its time limit is stopped and reported as failed, so a hung test cannot use
# the job's whole time and leave every other result unreported.
[profile.ci]
# A profile does not take the default profile's overrides unless it inherits them: without this
# line, the per-test settings that the overrides set are lost to the profile's own slow-timeout.
inherits = "default"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 15 }
default-filter = 'not (binary_id(null3d-shaders::build) & test(=the_repository_build_is_the_same_each_time_and_keeps_every_portability_rule))'

# `cargo nextest run -p null3d-shaders --test build --profile whole-shader-build` runs only that one:
# CI's determinism part and the nightly toolchain's run use it. The whole shader build gets most of
# its job's limit. A passing run still prints the test's output: a shard prints the split of the
# shader entries, with each shard's estimated share, so a job's log shows the balance.
[profile.whole-shader-build]
fail-fast = false
success-output = "immediate"
slow-timeout = { period = "300s", terminate-after = 24 }
default-filter = 'binary_id(null3d-shaders::build) & test(=the_repository_build_is_the_same_each_time_and_keeps_every_portability_rule)'
