# cargo-nextest runs each test in a process of its own, many at once. The test files that count
# allocations install a counting allocator and measure the engine's job workers too, so each of
# their tests runs with the machine to itself, as under cargo test, where no other test file runs
# beside them. Under the load of other tests, the light grid's allocation test once counted frees
# from job workers that an earlier case had stopped. The counter now stops counting a worker when
# its work returns, and running alone keeps such timing out of these tests.
# These tests run first: a test that needs the whole machine waits until every running test ends,
# and among the others it held back the rest of the run behind each slow test.
[[profile.default.overrides]]
filter = 'binary_id(null3d-render::no_alloc) | binary_id(null3d-core::no_alloc) | binary_id(null3d-core::bvh_no_alloc) | binary_id(null3d-core::arena_soak) | binary_id(null3d-core::depth_sort)'
threads-required = 'num-cpus'
priority = 100

# The one test that builds every shader takes the longest, so it starts next, while the many short
# tests fill the other threads. It runs two full builds at once, one on each of two threads. No
# other test builds every shader: each process would build them again, since tests share nothing.
[[profile.default.overrides]]
filter = 'binary_id(null3d-shaders::build) & test(=the_repository_build_is_the_same_each_time_and_keeps_every_portability_rule)'
threads-required = 2
priority = 50

# The custom material and effect tests build their templates' variants, which take seconds each.
[[profile.default.overrides]]
filter = 'binary_id(null3d-shaders::material) | binary_id(null3d-shaders::effect) | binary_id(null3d-shaders::pieces)'
priority = 40
