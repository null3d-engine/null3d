<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>null3D demos</title>
		<style>
			:root { color-scheme: dark; font: 15px/1.5 system-ui, sans-serif; }
			body { margin: 0; background: #0d1117; color: #e6e8eb; }
			a { color: #7fb2ff; }
			main { max-width: 44rem; margin: 0 auto; padding: 1.5rem 1rem; }
			li { margin-bottom: 1rem; }
			li p { margin: 0.25rem 0; }
			canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
			.panel { position: fixed; top: 0.75rem; left: 0.75rem; max-width: 24rem; padding: 0.5rem 0.75rem; background: rgb(13 17 23 / 0.8); border-radius: 6px; }
			.panel h1 { font-size: 1rem; margin: 0; }
			.panel p { margin: 0.25rem 0; }
			.error { color: #ff8a80; white-space: pre-wrap; }
		</style>
	</head>
	<body>
		<main></main>
		<script type="module" src="./index.ts"></script>
	</body>
</html>
