<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>null3D demos</title>
		<link rel="icon" href="data:," />
		<style>
			:root {
				color-scheme: dark;
				font: 15px/1.5 system-ui, sans-serif;
				--bg: #0d1117;
				--side: #11161d;
				--line: #222a33;
				--text: #e6e8eb;
				--muted: #8b949e;
				--link: #7fb2ff;
				--pick: #1c2633;
				--bar: 2.75rem;
				--drawer: min(18rem, 85vw);
			}
			* { box-sizing: border-box; }
			body {
				margin: 0;
				height: 100vh;
				height: 100dvh;
				overflow: hidden;
				display: grid;
				grid-template-columns: 16rem minmax(0, 1fr);
				background: var(--bg);
				color: var(--text);
			}
			a { color: var(--link); }
			:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
			.bar { display: none; }
			.sidebar {
				overflow-y: auto;
				overscroll-behavior: contain;
				padding: 1rem 0.75rem 1.5rem;
				background: var(--side);
				border-right: 1px solid var(--line);
			}
			.brand { margin: 0 0.5rem 0.75rem; font-weight: 600; }
			.brand a { color: var(--text); text-decoration: none; }
			.sidebar h2 {
				margin: 1rem 0.5rem 0.25rem;
				font-size: 0.75rem;
				font-weight: 600;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--muted);
			}
			.sidebar ul { margin: 0; padding: 0; list-style: none; }
			.sidebar li a {
				display: block;
				padding: 0.3rem 0.5rem;
				border-radius: 6px;
				color: var(--text);
				text-decoration: none;
			}
			.sidebar li a:hover { background: var(--pick); }
			.scene { display: block; font-size: 0.85em; color: var(--muted); font-weight: 400; }
			.name { display: block; }
			.sidebar li a[aria-current="page"] {
				background: var(--pick);
				box-shadow: inset 3px 0 0 var(--link);
				font-weight: 600;
			}
			.stage { position: relative; overflow: hidden; }
			canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
			.labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
			.label { padding: 0.1rem 0.4rem; font-size: 13px; white-space: nowrap; background: rgb(13 17 23 / 0.75); border-radius: 4px; }
			.label.active { background: #f2c14e; color: #111; }
			.caption {
				position: absolute;
				top: 0.75rem;
				left: 0.75rem;
				/* Room at the right for the stats overlay, collapsed to its frame rate. */
				max-width: min(24rem, calc(100% - 10rem));
				padding: 0.4rem 0.75rem;
				font-size: 14px;
				background: rgb(13 17 23 / 0.8);
				border-radius: 6px;
			}
			.caption summary {
				position: relative;
				cursor: pointer;
				/* Room at the right for the floating chevron, so the two-line title clears it. */
				padding-right: 1.7rem;
				list-style: none;
			}
			.caption summary::-webkit-details-marker { display: none; }
			.caption summary::marker { content: ""; }
			.caption__chevron {
				position: absolute;
				top: 0.05rem;
				right: 0;
				display: inline-flex;
				color: var(--muted);
				pointer-events: none;
			}
			.caption__chevron svg { transition: transform 200ms ease; }
			.caption[open] .caption__chevron svg { transform: rotate(180deg); }
			.caption h1 { display: inline; font-size: 1rem; margin: 0; }
			.caption p { margin: 0.35rem 0 0; }
			.caption .quiet { font-size: 12px; }
			.caption .quiet a { color: var(--muted); }
			.choices {
				position: absolute;
				bottom: 0.75rem;
				left: 0.75rem;
				right: 0.75rem;
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 0.5rem;
				pointer-events: none;
			}
			.choice {
				display: flex;
				align-items: center;
				gap: 0.25rem;
				padding: 0.25rem 0.4rem;
				font-size: 13px;
				background: rgb(13 17 23 / 0.8);
				border-radius: 6px;
				pointer-events: auto;
			}
			.choice span { color: var(--muted); margin: 0 0.3rem; }
			.choice button {
				font: inherit;
				color: var(--text);
				background: none;
				border: 1px solid transparent;
				border-radius: 4px;
				padding: 0.2rem 0.5rem;
				cursor: pointer;
			}
			.choice button:hover { background: var(--pick); }
			.choice button[aria-pressed='true'] { background: var(--pick); border-color: var(--link); }
			.compare { max-height: calc(100% - 1.5rem); overflow-y: auto; }
			/* The showcase controls HUD: translucent glass, opened by a chevron at the bottom. */
			.hud {
				position: absolute;
				left: 50%;
				bottom: 0;
				transform: translateX(-50%);
				width: min(960px, calc(100% - 20px));
				height: 100%;
				display: flex;
				flex-direction: column;
				justify-content: flex-end;
				align-items: center;
				gap: 10px;
				padding-bottom: max(10px, env(safe-area-inset-bottom));
				pointer-events: none;
				z-index: 10;
				font-size: 14px;
				line-height: 1.35;
			}
			.hud[hidden] { display: none; }
			.hud__chevron {
				flex: 0 0 auto;
				pointer-events: auto;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 6px;
				width: 74px;
				height: 40px;
				color: #eef2f7;
				background: rgb(14 18 27 / 0.38);
				border: 1px solid rgb(255 255 255 / 0.32);
				border-radius: 999px;
				backdrop-filter: blur(26px) saturate(1.3);
				-webkit-backdrop-filter: blur(26px) saturate(1.3);
				box-shadow: 0 10px 30px rgb(0 0 0 / 0.45), inset 0 1px 0 rgb(255 255 255 / 0.14);
				cursor: pointer;
				transition: transform 200ms ease, background 200ms ease;
			}
			.hud__chevron:hover { transform: translateY(-2px); background: rgb(10 14 20 / 0.66); }
			.hud__chevron svg { transition: transform 260ms cubic-bezier(0.2, 0.8, 0.2, 1); }
			.hud.open .hud__chevron svg { transform: rotate(180deg); }
			.hud__chevron .hud__key {
				font: 600 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
				padding: 3px 5px;
				border-radius: 5px;
				background: rgb(0 0 0 / 0.28);
				border: 1px solid rgb(255 255 255 / 0.18);
			}
			.hud__panel {
				flex: 0 1 auto;
				min-height: 0;
				width: 100%;
				background:
					linear-gradient(180deg, rgb(255 255 255 / 0.1), rgb(255 255 255 / 0.015) 26%, rgb(255 255 255 / 0) 60%),
					rgb(16 21 30 / 0.34);
				border: 1px solid rgb(255 255 255 / 0.32);
				border-radius: 16px;
				backdrop-filter: blur(26px) saturate(1.6);
				-webkit-backdrop-filter: blur(26px) saturate(1.6);
				box-shadow: 0 24px 60px rgb(0 0 0 / 0.5), inset 0 1px 0 rgb(255 255 255 / 0.22);
				display: flex;
				flex-direction: column;
				overflow: hidden;
				transform: translateY(110%);
				opacity: 0;
				max-height: 0;
				transition: transform 300ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 240ms ease, max-height 300ms cubic-bezier(0.2, 0.8, 0.2, 1);
				pointer-events: none;
			}
			.hud.open .hud__panel {
				transform: translateY(0);
				opacity: 1;
				/* Bounded: the tab bar and one group's buttons fit, and a taller group scrolls. */
				max-height: calc(100% - 60px);
				pointer-events: auto;
			}
			/* The tab bar scrolls across, so a phone shows every group without stacking them. */
			.hud__tabs {
				flex: 0 0 auto;
				display: flex;
				gap: 6px;
				padding: 10px 10px 0;
				overflow-x: auto;
				overscroll-behavior: contain;
			}
			.hud__tabs::-webkit-scrollbar { height: 6px; }
			.hud__tabs::-webkit-scrollbar-thumb { background: rgb(255 255 255 / 0.16); border-radius: 8px; }
			.hud__tab {
				flex: 0 0 auto;
				color: #cfd8e3;
				background: transparent;
				border: 1px solid transparent;
				border-radius: 999px;
				padding: 6px 12px;
				font: inherit;
				font-size: 13px;
				white-space: nowrap;
				cursor: pointer;
				transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
			}
			.hud__tab:hover { background: rgb(255 255 255 / 0.1); }
			.hud__tab:focus-visible { outline: 2px solid #7fd1ff; outline-offset: 2px; }
			.hud__tab--on {
				color: #06202e;
				background: linear-gradient(180deg, rgb(151 219 255 / 0.96), rgb(127 209 255 / 0.74));
				border-color: rgb(255 255 255 / 0.55);
				font-weight: 600;
				box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.65), 0 2px 12px rgb(127 209 255 / 0.35);
			}
			/* The selected group scrolls inside the bounded panel. */
			.hud__body {
				flex: 1 1 auto;
				min-height: 0;
				padding: 10px;
				overflow-y: auto;
				overscroll-behavior: contain;
			}
			.hud__body::-webkit-scrollbar { width: 8px; }
			.hud__body::-webkit-scrollbar-thumb { background: rgb(255 255 255 / 0.16); border-radius: 8px; }
			.hud__group {
				background: rgb(255 255 255 / 0.055);
				border: 1px solid rgb(255 255 255 / 0.14);
				border-radius: 12px;
				padding: 10px;
				backdrop-filter: blur(10px) saturate(1.4);
				-webkit-backdrop-filter: blur(10px) saturate(1.4);
				box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.1);
			}
			.hud__group[hidden] { display: none; }
			.hud__buttons { display: flex; flex-wrap: wrap; gap: 6px; }
			.hud__btn {
				display: inline-flex;
				align-items: center;
				gap: 7px;
				color: #eef2f7;
				background: linear-gradient(180deg, rgb(255 255 255 / 0.16), rgb(255 255 255 / 0.055));
				border: 1px solid rgb(255 255 255 / 0.24);
				border-radius: 999px;
				padding: 7px 11px;
				font: inherit;
				font-size: 13px;
				cursor: pointer;
				backdrop-filter: blur(12px) saturate(1.5);
				-webkit-backdrop-filter: blur(12px) saturate(1.5);
				box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.28), 0 2px 8px rgb(0 0 0 / 0.22);
				transition: background 140ms ease, border-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
			}
			.hud__btn:hover { background: linear-gradient(180deg, rgb(255 255 255 / 0.24), rgb(255 255 255 / 0.1)); border-color: rgb(255 255 255 / 0.32); }
			.hud__btn:focus-visible { outline: 2px solid #7fd1ff; outline-offset: 2px; }
			.hud__btn[aria-pressed="true"] {
				background: linear-gradient(180deg, rgb(151 219 255 / 0.96), rgb(127 209 255 / 0.74));
				color: #06202e;
				border-color: rgb(255 255 255 / 0.55);
				font-weight: 600;
				box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.65), 0 2px 12px rgb(127 209 255 / 0.35);
			}
			.hud__btn kbd {
				font: 600 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
				padding: 3px 5px;
				border-radius: 5px;
				background: rgb(0 0 0 / 0.28);
				border: 1px solid rgb(255 255 255 / 0.18);
				color: inherit;
			}
			.hud__btn--toggle::before {
				content: "";
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: rgb(255 255 255 / 0.35);
				box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.3);
			}
			.hud__btn--toggle[aria-pressed="true"]::before { background: #0b2b3b; }
			.hud__tip {
				position: absolute;
				z-index: 40;
				max-width: 240px;
				color: #eef2f7;
				background: rgb(10 14 20 / 0.66);
				border: 1px solid rgb(255 255 255 / 0.32);
				border-radius: 10px;
				padding: 8px 10px;
				font-size: 12.5px;
				line-height: 1.35;
				backdrop-filter: blur(12px);
				-webkit-backdrop-filter: blur(12px);
				box-shadow: 0 12px 30px rgb(0 0 0 / 0.5);
				pointer-events: none;
				opacity: 0;
				transform: translateY(4px);
				transition: opacity 120ms ease, transform 120ms ease;
			}
			.hud__tip.show { opacity: 1; transform: translateY(0); }
			.hud__toast {
				position: absolute;
				top: 0.9rem;
				left: 50%;
				transform: translate(-50%, -6px);
				z-index: 30;
				max-width: calc(100% - 2rem);
				padding: 8px 14px;
				color: #eef2f7;
				background: rgb(10 14 20 / 0.66);
				border: 1px solid rgb(255 255 255 / 0.32);
				border-radius: 999px;
				backdrop-filter: blur(14px) saturate(1.4);
				-webkit-backdrop-filter: blur(14px) saturate(1.4);
				box-shadow: 0 12px 30px rgb(0 0 0 / 0.45), inset 0 1px 0 rgb(255 255 255 / 0.2);
				font-size: 13px;
				pointer-events: none;
				opacity: 0;
				transition: opacity 200ms ease, transform 200ms ease;
			}
			.hud__toast.show { opacity: 1; transform: translate(-50%, 0); }
			/* The loading overlay that a demo shows from before the engine starts until its first frame. */
			.loader {
				position: absolute;
				inset: 0;
				z-index: 20;
				display: flex;
				align-items: center;
				justify-content: center;
				background: rgb(13 17 23 / 0.32);
				backdrop-filter: blur(6px) saturate(1.2);
				-webkit-backdrop-filter: blur(6px) saturate(1.2);
				pointer-events: none;
				transition: opacity 300ms ease;
			}
			.loader--done { opacity: 0; }
			.loader__box {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.75rem;
				min-width: min(17rem, 72%);
				padding: 1rem 1.25rem;
				color: #eef2f7;
				background:
					linear-gradient(180deg, rgb(255 255 255 / 0.1), rgb(255 255 255 / 0.015) 26%, rgb(255 255 255 / 0) 60%),
					rgb(16 21 30 / 0.34);
				border: 1px solid rgb(255 255 255 / 0.32);
				border-radius: 16px;
				backdrop-filter: blur(26px) saturate(1.6);
				-webkit-backdrop-filter: blur(26px) saturate(1.6);
				box-shadow: 0 24px 60px rgb(0 0 0 / 0.5), inset 0 1px 0 rgb(255 255 255 / 0.22);
				font-size: 14px;
			}
			.loader__label { margin: 0; max-width: 24rem; text-align: center; }
			.loader__label--error { color: #ff8a80; white-space: pre-wrap; text-align: left; }
			.loader__bar {
				width: 100%;
				height: 4px;
				border-radius: 999px;
				background: rgb(255 255 255 / 0.18);
				overflow: hidden;
			}
			.loader__fill {
				width: 40%;
				height: 100%;
				border-radius: 999px;
				background: linear-gradient(90deg, rgb(127 209 255 / 0.9), rgb(151 219 255 / 0.9));
				animation: loader-slide 1.1s ease-in-out infinite;
			}
			.loader__fill--set { animation: none; }
			@keyframes loader-slide {
				0% { margin-left: -40%; }
				100% { margin-left: 100%; }
			}
			.compare .switch { display: flex; gap: 0.25rem; }
			.compare .switch a { padding: 0.15rem 0.6rem; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; }
			.compare .switch a[aria-current="page"] { background: var(--pick); border-color: var(--link); color: var(--text); }
			.compare .count { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.35rem; }
			.compare .count input { flex: 1; min-width: 6rem; }
			.compare .count output { min-width: 10rem; font-variant-numeric: tabular-nums; }
			.compare .effects { display: flex; flex-wrap: wrap; gap: 0.15rem 0.75rem; color: var(--muted); }
			.compare button { margin-top: 0.4rem; padding: 0.3rem 0.8rem; font: inherit; color: var(--text); background: var(--pick); border: 1px solid var(--link); border-radius: 6px; cursor: pointer; }
			.compare button:disabled { opacity: 0.6; cursor: default; }
			.compare .result { font-weight: 600; font-variant-numeric: tabular-nums; }
			.compare .about ul { margin: 0.35rem 0 0; padding-left: 1.1rem; font-size: 13px; color: var(--muted); }
			/* The guided walkthrough's card, over the canvas and above the caption. */
			.walkthrough {
				position: absolute;
				left: 50%;
				bottom: max(0.75rem, env(safe-area-inset-bottom));
				transform: translateX(-50%);
				z-index: 15;
				width: min(38rem, calc(100% - 1.5rem));
				max-height: min(70%, calc(100% - 1.5rem));
				overflow-y: auto;
				overscroll-behavior: contain;
				padding: 1rem 1.1rem;
				color: #eef2f7;
				background:
					linear-gradient(180deg, rgb(255 255 255 / 0.1), rgb(255 255 255 / 0.015) 26%, rgb(255 255 255 / 0) 60%),
					rgb(16 21 30 / 0.78);
				border: 1px solid rgb(255 255 255 / 0.32);
				border-radius: 16px;
				backdrop-filter: blur(26px) saturate(1.5);
				-webkit-backdrop-filter: blur(26px) saturate(1.5);
				box-shadow: 0 24px 60px rgb(0 0 0 / 0.5), inset 0 1px 0 rgb(255 255 255 / 0.22);
				font-size: 14px;
				line-height: 1.45;
			}
			.walkthrough[hidden] { display: none; }
			.walkthrough h2 { margin: 0.1rem 0 0.4rem; font-size: 1.1rem; }
			.walkthrough p { margin: 0.4rem 0 0; }
			.walkthrough__eyebrow { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
			.walkthrough__mode { color: var(--muted); }
			.walkthrough__detail { margin-top: 0.5rem; }
			.walkthrough__detail summary { cursor: pointer; color: var(--link); font-size: 13px; }
			.walkthrough__detail p { margin-top: 0.35rem; }
			.walkthrough__status { font-weight: 600; font-variant-numeric: tabular-nums; }
			.walkthrough progress { display: block; width: 100%; height: 0.4rem; margin-top: 0.6rem; accent-color: var(--link); }
			.walkthrough__actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.9rem; }
			.walkthrough button {
				min-height: 2.5rem;
				padding: 0.4rem 1rem;
				font: inherit;
				color: var(--text);
				background: var(--pick);
				border: 1px solid var(--line);
				border-radius: 8px;
				cursor: pointer;
			}
			.walkthrough button.primary { border-color: var(--link); font-weight: 600; }
			.walkthrough button:disabled { opacity: 0.55; cursor: default; }
			.walkthrough__table-scroll { margin-top: 0.6rem; overflow-x: auto; }
			.walkthrough table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
			.walkthrough caption { padding-bottom: 0.35rem; text-align: left; color: var(--muted); }
			.walkthrough th, .walkthrough td { padding: 0.24rem 0.35rem; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
			.walkthrough th { font-weight: 600; color: var(--muted); }
			.walkthrough th:first-child, .walkthrough td:first-child { padding-left: 0; text-align: left; }
			.walkthrough .cap { font-size: 11px; color: var(--muted); }
			.walkthrough__notes { margin: 0.7rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: 12.5px; }
			.walkthrough__notes li { margin-top: 0.25rem; }
			.welcome { max-width: 36rem; padding: 2rem 1.5rem; }
			.welcome h1 { font-size: 1.4rem; margin: 0 0 0.75rem; }
			.error { color: #ff8a80; white-space: pre-wrap; }
			@media (max-width: 767.98px) {
				body { grid-template-columns: minmax(0, 1fr); grid-template-rows: var(--bar) minmax(0, 1fr); }
				.bar {
					display: flex;
					align-items: center;
					gap: 0.75rem;
					padding: 0 0.5rem;
					background: var(--side);
					border-bottom: 1px solid var(--line);
				}
				.bar .brand { margin: 0; }
				.menu {
					display: inline-flex;
					align-items: center;
					gap: 0.4rem;
					padding: 0.3rem 0.6rem;
					font: inherit;
					color: var(--text);
					background: transparent;
					border: 1px solid var(--line);
					border-radius: 6px;
				}
				.menu svg { width: 1rem; height: 1rem; }
				/* The drawer slides in under the bar, so the menu button stays in reach to close it. */
				.sidebar {
					position: fixed;
					top: var(--bar);
					bottom: 0;
					left: 0;
					z-index: 2;
					width: var(--drawer);
					transform: translateX(-100%);
					visibility: hidden;
					transition: transform 0.2s ease, visibility 0s linear 0.2s;
				}
				.sidebar.open { transform: none; visibility: visible; transition: transform 0.2s ease; }
				.sidebar .brand { display: none; }
				.backdrop { position: fixed; inset: var(--bar) 0 0 0; z-index: 1; background: rgb(0 0 0 / 0.5); }
				/* The stats overlay sits over the whole page, so it hides while the drawer is open. */
				body:has(.sidebar.open) [data-null3d-stats] { display: none; }
				.welcome { padding: 1.25rem 1rem; }
				.walkthrough {
					width: calc(100% - 1rem);
					max-height: min(74%, calc(100% - 1rem));
					padding: 0.85rem 0.9rem;
				}
				.walkthrough button { min-height: 2.75rem; }
			}
			@media (prefers-reduced-motion: reduce) {
				.sidebar, .sidebar.open { transition: none; }
				.loader { transition: none; }
