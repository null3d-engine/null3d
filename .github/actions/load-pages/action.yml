name: The load builds
description: >-
  Hands the load builds, the benchmark pages and the startup pages, from the job that builds them
  to the jobs that serve them, as one artifact. Each page's build holds the whole shader set, so
  the builds repeat most of their files: in run 39854225392 they held 19,827 files and 8.52 GB, of
  which 7,271 contents and 2.90 GB were distinct. "upload" links the files of equal contents and
  packs both folders into one tar file, which holds each content once, compressed on every core;
  "download" takes the file and unpacks it. Run "upload" after `bun tests/lib/load-server.ts`.

inputs:
  mode:
    description: '"upload" packs and uploads the builds; "download" takes and unpacks them.'
    required: true

runs:
  using: composite
  steps:
    - name: Pack the load builds, each content once
      if: inputs.mode == 'upload'
      shell: bash
      run: |
        bun tools/link-duplicates.ts target/bench-pages target/startup-pages
        tar -cf - -C target bench-pages startup-pages | zstd -T0 -3 -q -o target/load-pages.tar.zst
        ls -l target/load-pages.tar.zst
    # The file is compressed already.
    - uses: actions/upload-artifact@v4
      if: inputs.mode == 'upload'
      with:
        name: load-pages
        path: target/load-pages.tar.zst
        compression-level: 0
        if-no-files-found: error
        retention-days: 1
    - uses: actions/download-artifact@v4
      if: inputs.mode == 'download'
      with:
        name: load-pages
        path: target
    - name: Unpack the load builds
      if: inputs.mode == 'download'
      shell: bash
      run: |
        zstd -dc target/load-pages.tar.zst | tar -xf - -C target
        rm target/load-pages.tar.zst
