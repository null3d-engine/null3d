name: Install Chromium for Playwright
description: >-
  Installs Playwright's Chromium and the Ubuntu packages that it needs. Ubuntu's package mirror
  sometimes stalls for minutes, so the browser and the downloaded packages stay in the Actions
  cache, and a job downloads them again only after Playwright's version changes. The cache saves
  only when the workflow's SAVE_CACHES is true.

inputs:
  cache-only:
    description: >-
      "true" only keeps the Actions cache current: when the cache already holds this version, the
      step downloads and installs nothing.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v4
      id: restore
      with:
        lookup-only: ${{ inputs.cache-only }}
        path: |
          ~/.cache/ms-playwright
          ~/.cache/playwright-debs
        key: playwright-chromium-${{ runner.os }}-${{ hashFiles('tests/package.json', 'bench/package.json') }}
    - name: Install Chromium and its packages
      if: inputs.cache-only != 'true' || steps.restore.outputs.cache-hit != 'true'
      shell: bash
      working-directory: tests
      run: |
        debs="$HOME/.cache/playwright-debs"
        mkdir -p "$debs"
        # apt installs a package from its archive folder when the right version is already there.
        if compgen -G "$debs/*.deb" > /dev/null; then sudo cp "$debs"/*.deb /var/cache/apt/archives/; fi
        # A stalled mirror connection gives up after a short wait and apt tries again, instead of
        # holding the job until its time limit.
        printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "3";\n' \
          | sudo tee /etc/apt/apt.conf.d/99-null3d-timeouts > /dev/null
        # One more attempt if the whole install still stalls.
        timeout 300 bunx playwright install --with-deps chromium || timeout 300 bunx playwright install --with-deps chromium
        if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then cp /var/cache/apt/archives/*.deb "$debs"/; fi
    - uses: actions/cache/save@v4
      if: env.SAVE_CACHES == 'true' && steps.restore.outputs.cache-hit != 'true'
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/playwright-debs
        key: playwright-chromium-${{ runner.os }}-${{ hashFiles('tests/package.json', 'bench/package.json') }}
