name: Fetch the sample content
description: >-
  Fetches the sample content that tests load, the glTF models among them, into the cache that
  every copy of the repository shares, as .dev/sample-content.md says. The Actions cache keeps the
  pinned commit's files, so a job downloads them again only when tools/samples/lock.json changes.
  bun run samples:fetch then checks the cached copy's marker, or downloads the commit and checks
  every file's SHA-256 when the cache missed.

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.cache/null3d/samples
        key: null3d-samples-${{ hashFiles('tools/samples/lock.json') }}
    - name: Fetch and check the sample content
      shell: bash
      run: bun run samples:fetch
