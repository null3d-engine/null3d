name: Token write probe

# Temporary: the repository's default workflow permission is read-only, and the release workflow
# relies on its own `permissions: contents: write` to push. This proves that works. Deleted once it
# has run.

on:
  push:
    branches: [fix/release-notes-direct-push]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Push a scratch branch with the default token
        run: git push origin HEAD:refs/heads/token-write-probe
