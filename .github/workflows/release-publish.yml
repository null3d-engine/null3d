name: Release Publish

# Runs when a release pull request (branch release/<version>, opened by release.yml) merges. It
# tags the plain version on a commit that adds every generated file to the merge commit, publishes
# a GitHub Release whose notes are that version's CHANGELOG.md section, then publishes every package
# that is not private to npm. Main keeps no generated file (D-105), and the tagged commit holds them
# for what reads the release from git: the Claude Code plugin, `skills add` and the docs on GitHub.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"

jobs:
  publish:
    runs-on: ubuntu-latest
    # The shader modules build on a machine with no Rust cache.
    timeout-minutes: 30
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: write # push the tag and create the GitHub Release
    env:
      HUSKY: "0"
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: bun install --frozen-lockfile
      # The engine page's API reference names the shader features, which the shader modules hold.
      - run: bun run shaders

      - name: Tag the release and publish the GitHub Release
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          version="${HEAD_REF#release/}"
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "::error::Tag ${version} already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The tagged commit's parent is the merge commit on main, so the next release's changelog
          # still starts after it.
          bun tools/generate.ts --stage
          git commit -m "chore(release): ${version} with its generated files"
          git tag -a "$version" -m "Release ${version}"
          git push origin "refs/tags/${version}"
          bun run release --notes "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$version" --title "$version" --notes-file "$RUNNER_TEMP/notes.md"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # claude.ai and the Claude desktop app take a skill as a zip file with the skill's folder at
      # its root and exactly one SKILL.md. The generated copies, which the step above wrote, hold no
      # evals.
      - name: Attach each skill to the release as a zip file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          cd .claude/skills
          for dir in */; do
            name="${dir%/}"
            zip -qr "$RUNNER_TEMP/${name}.zip" "$name"
            count="$(unzip -Z1 "$RUNNER_TEMP/${name}.zip" | grep -c 'SKILL.md$' || true)"
            if [ "$count" != 1 ]; then
              echo "::error::${name}.zip holds ${count} SKILL.md files, not one."
              exit 1
            fi
          done
          gh release upload "$VERSION" "$RUNNER_TEMP"/*.zip

  # npm trusted publishing: npm checks the workflow's OIDC identity against the trusted publisher
  # set on each package at npmjs.com, so no token is stored. A package's first version cannot be
  # published this way, so a maintainer publishes it once by hand. NPM_TOKEN and NODE_AUTH_TOKEN
  # stay unset: npm skips OIDC when either is set, even to an empty string.
  publish-npm:
    runs-on: ubuntu-latest
    # The WebAssembly build takes several minutes on a machine with no Rust cache.
    timeout-minutes: 30
    needs: publish
    permissions:
      contents: read
      id-token: write # the OIDC token that npm trusted publishing and provenance need
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.publish.outputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: bun install --frozen-lockfile
      # Git keeps neither the WebAssembly files nor the shader modules. This builds the shader
      # modules, the engine's two WebAssembly files, the Vite plugin's shader compiler and the
      # command-line tool's asset formats.
      - name: Build the WebAssembly files and the shader modules
        run: bun tools/build-wasm.ts --pages-only
      # Bun packs each package: its prepack script builds the JavaScript and declarations, and Bun
      # writes the real version in place of each workspace: version, which npm cannot install. The
      # check fails unless each tarball holds every file it needs.
      - name: Pack and check every public package
        run: bun tools/pack-packages.ts --out "$RUNNER_TEMP/npm"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      # npm publishes each tarball that Bun packed; the publishConfig inside it asks for public
      # access and provenance. A version npm already has is skipped, so running the job again
      # after a partial failure publishes only what is missing.
      - name: Publish every public package
        run: |
          for tarball in "$RUNNER_TEMP"/npm/*.tgz; do
            spec="$(tar -xOzf "$tarball" package/package.json | node -p \
              "const p = JSON.parse(require('fs').readFileSync(0, 'utf8')); p.name + '@' + p.version")"
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "Skipping ${spec}: already on npm"
              continue
            fi
            echo "Publishing ${spec}"
            npm publish "$tarball" --access public
          done
