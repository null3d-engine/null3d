name: Release Publish

# Runs when a release pull request (branch release/<version>, opened by release.yml) merges. It
# tags the merge commit with the plain version, publishes a GitHub Release whose notes are that
# version's CHANGELOG.md section, then publishes every package that is not private to npm.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: write # push the tag and create the GitHub Release
    env:
      HUSKY: "0"
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Tag the release and publish the GitHub Release
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          version="${HEAD_REF#release/}"
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "::error::Tag ${version} already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Release ${version}"
          git push origin "refs/tags/${version}"
          bun run release --notes "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$version" --title "$version" --notes-file "$RUNNER_TEMP/notes.md"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  # npm trusted publishing: npm checks the workflow's OIDC identity against the trusted publisher
  # set on each package at npmjs.com, so no token is stored. A package's first version cannot be
  # published this way, so a maintainer publishes it once by hand. NPM_TOKEN and NODE_AUTH_TOKEN
  # stay unset: npm skips OIDC when either is set, even to an empty string.
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish
    permissions:
      contents: read
      id-token: write # the OIDC token that npm trusted publishing and provenance need
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.publish.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      # A version npm already has is skipped, so running the job again after a partial failure
      # publishes only what is missing.
      - name: Publish every package that is not private
        run: |
          for manifest in packages/*/package.json; do
            dir="$(dirname "$manifest")"
            if [ "$(node -p "require('./${manifest}').private === true")" = "true" ]; then
              echo "Skipping ${dir}: private"
              continue
            fi
            spec="$(node -p "const p = require('./${manifest}'); p.name + '@' + p.version")"
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "Skipping ${spec}: already on npm"
              continue
            fi
            echo "Publishing ${spec}"
            (cd "$dir" && npm publish --access public)
          done
