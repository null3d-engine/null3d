name: CI

# Work lands on main by direct push (D-157 in .dev/decisions), and each push to main runs every
# job, as .dev/pull-requests.md lists them. A run started by hand runs every job too:
# gh workflow run ci.yml --ref main
# The pull request and merge queue events stay from the earlier flow (D-99), which no longer runs:
# a draft ran only the quick checks, and a docs-only pull request only the build, the docs, style,
# skills and unit checks. The changes job decides what each run tests.
on:
  push:
    branches: [main]
  # A draft that becomes ready for review starts its full run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Only while main's rules still send pull requests through the merge queue (D-99).
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main cancels main's run still in progress, so CI's machines test only the newest
# code (the owner's choice, D-157). A cancelled job then reads "cancelled", as a job that hits its
# time limit does; ci-passed says which of the two stopped it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  # Bun before 1.4.3 closes Playwright's pipe to Chrome at random, which hangs browser steps
  # (.dev/releases.md). tests/lib/bun-version.test.ts holds every pin to package.json's.
  BUN_VERSION: "1.4.3"
  # Anthropic's skill validator, pinned to one commit of anthropics/skills.
  SKILL_VALIDATOR_URL: https://raw.githubusercontent.com/anthropics/skills/1ed29a03dc852d30fa6ef2ca53a67dc2c2c2c563/skills/skill-creator/scripts/quick_validate.py
  # Only main's runs save caches, and every run restores main's. A pull request's or a merge queue
  # run's cache serves only that pull request or queue branch, and their saves filled GitHub's cache
  # limit for the repository, so that GitHub dropped main's caches.
  SAVE_CACHES: ${{ github.ref == 'refs/heads/main' }}
  # The commit that main pointed to before this push, empty on other events. The size check compares
  # with it, and the commit check reads the commits after it: after a merge and a push, the commit
  # before (HEAD^) is the branch's own, not main's.
  PUSH_BEFORE: ${{ github.event.before }}

jobs:
  changes:
    # What a run tests, from the files that a pull request changes. Every other event tests
    # everything. The merge commit's first parent is main, so the diff holds the pull request's
    # changes alone, and a rename counts as both its old and its new path.
    # - code: false when every file is a docs file: a Markdown file, or a file in .dev/, docs/ or
    #   skills/. Only the docs-and-tools job reads those, apart from the sketches below. The other
    #   quick checks and every browser, benchmark and macOS job then skip.
    # - full: the browser, city, benchmark page and real-browser jobs run. A draft skips them too.
    # - allocation: the allocation job runs, in a full run that changes the code whose per-frame
    #   allocation it checks, or the check itself: the engine's render, GPU, sketch, scene and shared
    #   code, the add-ons, the core's crates, and the benchmark pages and the check's tools.
    # - sketches: a docs-only pull request that is no draft changes the skills' or the cookbook's
    #   Markdown, whose complete sketches the browser tests draw. The skill-sketches job draws them.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      full: ${{ steps.paths.outputs.full }}
      allocation: ${{ steps.paths.outputs.allocation }}
      sketches: ${{ steps.paths.outputs.sketches }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: Find what the pull request changes
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          DOCS: ^(\.dev/|docs/|skills/)|\.md$
          SKETCHES: ^(skills|docs/cookbook)/.*\.md$
          ALLOCATION: ^(packages/engine/src/(render|gpu|sketch|scene|shared)/|packages/(particles|terrain|impostors)/src/|crates/null3d-(core|render|wasm)/src/|bench/allocation\.ts$|bench/lib/(allocation|devtools|serve|source-names)\.ts$|bench/pages/null3d/|\.github/workflows/ci\.yml$)
        run: |
          code=true full=true allocation=true sketches=false
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            echo "$files"
            if [ -n "$files" ] && ! grep -qvE "$DOCS" <<< "$files"; then code=false; fi
            if [ "$code" = false ] || [ "$DRAFT" = true ]; then full=false; fi
            if [ "$full" = false ] || ! grep -qE "$ALLOCATION" <<< "$files"; then allocation=false; fi
            if [ "$code" = false ] && [ "$DRAFT" != true ] && grep -qE "$SKETCHES" <<< "$files"; then
              sketches=true
            fi
          fi
          printf 'code=%s\nfull=%s\nallocation=%s\nsketches=%s\n' "$code" "$full" "$allocation" "$sketches" | tee -a "$GITHUB_OUTPUT"

  docs-and-tools:
    # The type check and the unit tests read the shader modules, which the build job makes.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Git hooks are for local commits; this job runs the same checks directly.
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/bun-install
      - uses: actions/download-artifact@v4
        with:
          name: page-wasm

      # Git keeps no generated file (D-105). The install step wrote them before the shader modules
      # arrived, so this writes them again, and fails when a generator wrote a file that git keeps.
      - name: The generators change no file that git keeps
        run: |
          bun tools/generate.ts
          git status --porcelain
          test -z "$(git status --porcelain)"

      - run: bun run docs:check
      - run: bun run docs:style
      - run: bun run skills:check

      - name: Skill validator
        run: |
          pip install --quiet pyyaml
          curl -fsSL "$SKILL_VALIDATOR_URL" -o "$RUNNER_TEMP/quick_validate.py"
          for skill in skills/*/; do python3 "$RUNNER_TEMP/quick_validate.py" "$skill"; done

      - run: bun run check
      - run: bun run typecheck
      # The meshopt unit tests read the Khronos test file and build test files from the samples.
      - uses: ./.github/actions/samples
      - run: bun run test

  commits:
    # The commit messages and their trailers, which the commit hooks check locally: on a push, every
    # commit after main's commit before the push; on a pull request, every commit of its branch. A
    # push that starts a branch, or replaces its history, has no commit before, and checks nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUSKY: "0"
      FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/bun-install
      - name: Commit messages and trailers
        run: |
          if [ -z "$FROM" ] || [ "$FROM" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$FROM^{commit}"; then
            echo "No commit before this push to compare with, so no commit is checked."
            exit 0
          fi
          git log --oneline --no-merges "$FROM..$TO"
          bunx commitlint --from "$FROM" --to "$TO"
          bun tools/hooks/check-trailers.ts "$FROM..$TO"

  rust-lint:
    # Formatting and Clippy. Clippy only checks the code and the tests compile it in full, so the
    # two share almost no build output and run as jobs of their own.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # The cache's own key leaves out the build profiles in the workspace's Cargo.toml, so a
      # profile change would keep restoring a cache built with the old profile. The cache also
      # names the job, so each job restores what it built itself.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ env.SAVE_CACHES == 'true' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy rejects a call to the system clock
        run: |
          if cargo clippy --manifest-path tools/fixtures/disallowed-clock/Cargo.toml --target-dir target/lint-fixture 2> clippy.log; then
            echo "Clippy accepted a call to SystemTime::now"
            exit 1
          fi
          grep -q 'disallowed method `std::time::SystemTime::now`' clippy.log

  rust-tests:
    # The Rust tests through cargo-nextest, which runs the tests of every test file at once.
    # cargo test runs the files one after another, and a few slow files then set the job's time.
    # The one test that builds every shader, twice, takes longer than all the others together, so
    # it runs in a job of its own beside them. The profiles in .config/nextest.toml split the tests.
    # --no-fail-fast runs every test after a failure, so a run reports every failing test.
    name: rust-tests (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Every CI job should take at most 15 minutes. The other tests stop at 35, and the whole shader
    # build at 90, until the shader build runs on every core.
    timeout-minutes: ${{ matrix.limit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: every test but the whole shader build
            id: ci
            tests: --workspace --profile ci
            limit: 35
          - part: the whole shader build
            id: whole-shader-build
            tests: -p null3d-shaders --test build --profile whole-shader-build
            limit: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}-${{ matrix.id }}
          save-if: ${{ env.SAVE_CACHES == 'true' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - run: cargo nextest run --no-fail-fast ${{ matrix.tests }}
      # nextest runs no documentation tests.
      - if: matrix.id == 'ci'
        run: cargo test --workspace --doc --no-fail-fast

  build:
    # The files that the other jobs need, built once on Linux: the engine's two WebAssembly files,
    # the shader compiler that the dev server runs on the WGSL in the test sketches, the asset
    # tool's formats that the unit tests load, and the shader modules, which git does not keep, with the record of the inputs they were built from. The
    # files are the same on every platform, so each job below downloads them instead of spending
    # about 2 minutes to build them again.
    runs-on: ubuntu-latest
    # A shader build that compiles every shader takes longer than 35 minutes on one core. The limit
    # comes down when the shader build runs on every core.
    timeout-minutes: 90
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # The cache saves only when its key finds no full match. The key names the native shader
      # build, which this job compiles too, so the saved cache holds it.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}-shader-build
          save-if: ${{ env.SAVE_CACHES == 'true' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The shader caches between runs: a run builds only the shaders whose inputs changed.
      - name: Build the shader modules and the WebAssembly files that the test pages need
        uses: ./.github/actions/shaders
        with:
          run: bun tools/build-wasm.ts --pages-only
      # The artifact's paths start at the repository's root, their closest shared folder.
      - uses: actions/upload-artifact@v4
        with:
          name: page-wasm
          path: |
            packages/engine/dist/
            packages/vite-plugin/dist/
            packages/cli/dist/
            packages/engine/src/generated/shaders*.ts
            packages/engine/src/generated/shaders-*.js
            packages/engine/src/generated/shader-features.ts
            target/shader-modules.json
          if-no-files-found: error
          retention-days: 1

  size-base:
    # The sizes of the size check's base commit, built at that commit with its own toolchain,
    # packages and build script, as the check builds a base in a worktree. Many runs share a base:
    # a run on main builds on main's commit before its push, which that commit's own run kept. Each
    # run on main keeps its own commit's sizes (wasm-checks below). So the sizes stay in the Actions
    # cache by commit, and a run that finds them builds nothing. Otherwise this job builds the base
    # beside the build job, and the size check waits for both.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A shader build that compiles every shader takes longer than 35 minutes on one core. The limit
    # comes down when the shader build runs on every core.
    timeout-minutes: 90
    env:
      HUSKY: "0"
    steps:
      # The size check finds its base in the history. A run on main compares with main's commit
      # before the push, so the growth that landed before never counts against the newest push.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Find the size check's base
        id: base
        run: echo "sha=$(bun tools/build-wasm.ts --print-base)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: kept
        with:
          path: target/.size-base/${{ steps.base.outputs.sha }}.json
          key: size-base-${{ steps.base.outputs.sha }}
      - name: Check out the base
        if: steps.kept.outputs.cache-hit != 'true'
        run: git checkout --force --detach ${{ steps.base.outputs.sha }}
      - name: Install the base's Rust toolchain
        if: steps.kept.outputs.cache-hit != 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: steps.kept.outputs.cache-hit != 'true'
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ env.SAVE_CACHES == 'true' }}
      # The base is usually an earlier commit of main, whose run kept its shaders in the cache.
      - name: Build the base
        if: steps.kept.outputs.cache-hit != 'true' && hashFiles('.github/actions/shaders/action.yml') != ''
        uses: ./.github/actions/shaders
        with:
          run: |
            bun install --frozen-lockfile
            bun tools/build-wasm.ts --sizes-only
      # A base from before the shader caches in CI builds every shader.
      - name: Build the base, which has no shader cache action
        if: steps.kept.outputs.cache-hit != 'true' && hashFiles('.github/actions/shaders/action.yml') == ''
        run: |
          bun install --frozen-lockfile
          bun tools/build-wasm.ts --sizes-only
      - name: Keep the base's sizes
        if: steps.kept.outputs.cache-hit != 'true'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          mkdir -p target/.size-base
          cp target/size-report.json "target/.size-base/$BASE.json"
      - uses: actions/upload-artifact@v4
        with:
          name: size-base
          path: target/.size-base/${{ steps.base.outputs.sha }}.json
          if-no-files-found: error
          retention-days: 1

  wasm-checks:
    # The size check: the files of the build job, and the engine test page built here, against the
    # base's sizes from the size-base job. The build job builds the same files with the same flags,
    # so the check builds no WebAssembly. A run on main then keeps its commit's sizes, as the base of
    # the runs that build on it.
    needs: [build, size-base, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      # The check reads the trailers of the commits since the base.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: page-wasm
      - uses: actions/download-artifact@v4
        with:
          name: size-base
          path: target/.size-base
      - name: Check the sizes of the build job's files against the base's build
        run: bun tools/build-wasm.ts --check-size --prebuilt
      # The check writes the sizes before it judges them, so main keeps them also after a failure.
      - name: Keep the sizes of this commit of main
        if: "!cancelled() && github.event_name == 'push' && hashFiles('target/size-report.json') != ''"
        run: |
          mkdir -p target/.size-base
          cp target/size-report.json "target/.size-base/$GITHUB_SHA.json"
      - uses: actions/cache/save@v4
        if: "!cancelled() && github.event_name == 'push' && hashFiles('target/size-report.json') != ''"
        with:
          path: target/.size-base/${{ github.sha }}.json
          key: size-base-${{ github.sha }}

  shader-compiler:
    # The shader crate's build tests again through the build job's shader compiler, which must give
    # the native build's results, then the compiler's own tests and the Vite plugin's WGSL tests.
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Its repository-wide shader test builds every shader, which takes longer than 35 minutes on one
    # core. The limit comes down when the shader build runs on every core.
    timeout-minutes: 90
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ env.SAVE_CACHES == 'true' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: page-wasm
      - name: The shader compiler gives the native shader build's results
        run: bun run test:shader-compiler

  packages:
    # The npm packages as a developer installs them: each public package packed as the publish job
    # packs it, and checked for every file it needs, then installed into a fresh Vite project where
    # the command-line tool's test command type checks the project and draws its sketch on every
    # GPU tier, and Vite builds it for production. Then the project builds a page of its own layout
    # around a copy of examples/, as the website does, and two demos must start from that build.
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/bun-install
      - uses: actions/download-artifact@v4
        with:
          name: page-wasm
      - uses: ./.github/actions/playwright-chromium
      # The step takes 1 to 3 minutes. Its limit ends a stuck browser well before the job's, with
      # the step named as the one that ran out of time.
      - name: The packed packages in a fresh project
        timeout-minutes: 8
        run: bun run test:packages

  browser:
    # The browser tests, the image test manifest among them. Most run in shards at once. Playwright
    # splits them by count, in its order of the tests, and the weights below give each shard its
    # share, so that the shards take about the same time. The tests that run alone check frame
    # rates, times and allocations, which a heavy test beside them can upset, so they run one at a
    # time in a job of their own (tests/lib/alone.ts). `bun run test:browser-weights` works out the
    # weights, and .dev/image-tests.md says when to retune them and when to add a shard.
    name: browser (${{ matrix.part }})
    needs: [build, changes]
    # Every run but a draft's or a docs-only pull request's, as the bench and real-browsers jobs.
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    # A shard's tests take about 12 minutes, with the median times that the weights come from, and
    # its setup about 1. A shard that meets a slow machine runs its tests up to twice as slowly as
    # the median, so the limit leaves room for that rather than for a hang.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: shard 1 of 15, id: 1, tests: --grep-invert "@alone|$CITY_TESTS" --shard=1/15 }
          - { part: shard 2 of 15, id: 2, tests: --grep-invert "@alone|$CITY_TESTS" --shard=2/15 }
          - { part: shard 3 of 15, id: 3, tests: --grep-invert "@alone|$CITY_TESTS" --shard=3/15 }
          - { part: shard 4 of 15, id: 4, tests: --grep-invert "@alone|$CITY_TESTS" --shard=4/15 }
          - { part: shard 5 of 15, id: 5, tests: --grep-invert "@alone|$CITY_TESTS" --shard=5/15 }
          - { part: shard 6 of 15, id: 6, tests: --grep-invert "@alone|$CITY_TESTS" --shard=6/15 }
          - { part: shard 7 of 15, id: 7, tests: --grep-invert "@alone|$CITY_TESTS" --shard=7/15 }
          - { part: shard 8 of 15, id: 8, tests: --grep-invert "@alone|$CITY_TESTS" --shard=8/15 }
          - { part: shard 9 of 15, id: 9, tests: --grep-invert "@alone|$CITY_TESTS" --shard=9/15 }
          - { part: shard 10 of 15, id: 10, tests: --grep-invert "@alone|$CITY_TESTS" --shard=10/15 }
          - { part: shard 11 of 15, id: 11, tests: --grep-invert "@alone|$CITY_TESTS" --shard=11/15 }
          - { part: shard 12 of 15, id: 12, tests: --grep-invert "@alone|$CITY_TESTS" --shard=12/15 }
          - { part: shard 13 of 15, id: 13, tests: --grep-invert "@alone|$CITY_TESTS" --shard=13/15 }
          - { part: shard 14 of 15, id: 14, tests: --grep-invert "@alone|$CITY_TESTS" --shard=14/15 }
          - { part: shard 15 of 15, id: 15, tests: --grep-invert "@alone|$CITY_TESTS" --shard=15/15 }
          - { part: tests that run alone, id: alone, tests: --grep @alone --workers=1 }
    env:
      HUSKY: "0"
      # S6's image tests, which load the city's files: the browser-city job runs them.
      CITY_TESTS: '\bs6 on '
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The build job's files, at their places in the repository.
      - uses: actions/download-artifact@v4
        with:
          name: page-wasm
      - uses: ./.github/actions/playwright-chromium
      - uses: ./.github/actions/samples
      - name: Browser tests on SwiftShader, WebGPU and WebGL2
        env:
          # One weight for each shard of the matrix, in its order.
          PWTEST_SHARD_WEIGHTS: "118:154:283:511:209:143:80:47:193:199:24:28:28:138:308"
        run: bun run test:browser ${{ matrix.tests }}
      # The images that differ from their references, or have none yet, with their diffs:
      # bun run images:review --ci <run> fetches them.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.id }}
          path: test-results/
          if-no-files-found: ignore

  city:
    # S6's city files, built once per run and handed to the jobs that load S6 as artifacts. A build
    # without the cache takes about 6 minutes here, which every shard of a job could not spare
    # (D-106). With the cache, which a pull request reads from main, it takes seconds.
    name: city files
    needs: [build, changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: page-wasm
      - uses: ./.github/actions/samples
      - uses: ./.github/actions/city
        with:
          mode: build

  browser-city:
    # S6's image tests, the browser tests that load the city's files, which the browser job's shards
    # leave out, so that only this job waits for the city job.
    name: browser (the city)
    needs: [build, city, changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: page-wasm
      - uses: ./.github/actions/playwright-chromium
      - uses: ./.github/actions/samples
      - uses: ./.github/actions/city
        with:
          mode: download
      - name: S6's image tests on SwiftShader, WebGPU and WebGL2
        run: bun run test:browser --grep '\bs6 on '
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-city
          path: test-results/
          if-no-files-found: ignore

  skill-sketches:
    # The complete sketches in the skills' and the cookbook's Markdown, drawn on every GPU tier, for
    # a docs-only pull request that changes that Markdown. Every full run draws them in the browser
    # job's shards instead.
    name: browser (skill sketches)
    needs: [build, changes]
    if: needs.changes.outputs.sketches == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: page-wasm
      - uses: ./.github/actions/playwright-chromium
      # The cookbook's recipes load sample files.
      - uses: ./.github/actions/samples
      - name: The skill sketches on SwiftShader, WebGPU and WebGL2
        run: bun run test:browser skill-sketches.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-skill-sketches
          path: test-results/
          if-no-files-found: ignore

  bench:
    # The benchmark pages' tests on SwiftShader, in two shards of about equal measured time.
    # Playwright's own --shard splits the test list into equal counts in file order, and these
    # tests differ too much in length for that: it gave one shard 221 tests and over 13 minutes,
    # and the other 4 tests and 3 minutes. Shard 1 runs the tests that BENCH_SHARD_1 names, and
    # shard 2 every other test, so each test runs in exactly one shard.
    # S4's and S5's pages run in order in one worker each, and both sit in shard 1: beside the
    # parity tests' setup in shard 2, S4 on WebGL2 twice measured no frame on SwiftShader. The
    # engine's limit of frames in flight failed open then (.dev/implementation-notes.md).
    # Shard 2 takes every parity test. Each scene's tests run in order in one worker, and the
    # scenes spread over both workers. In main's run 38176334909 (11 October 2026), the parity
    # tests took 13.2 minutes one after another, and shard 2's other tests 3.1 minutes, so shard
    # 2's tests should take about 8.2 minutes on two workers. Shard 1's page tests ended at 7.2.
    # .dev/benchmarks.md holds the figures.
    name: bench (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    # Every build of the pages holds S6's, so both shards need the city's files.
    needs: [build, city, changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            select: --grep
          - shard: 2
            select: --grep-invert
    env:
      HUSKY: "0"
      BENCH_SHARD_1: 'pages\.spec\.ts.*\b(s5|s4|s3|s1|s1-static|s1-cells)\b'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: page-wasm
      - uses: ./.github/actions/playwright-chromium
      - uses: ./.github/actions/samples
      # S6 loads the city's files, which the city job built.
      - uses: ./.github/actions/city
        with:
          mode: download
      - name: The benchmark pages on SwiftShader
        run: bun run test:bench ${{ matrix.select }} "$BENCH_SHARD_1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bench-test-results-${{ matrix.shard }}
          path: |
            test-results/
            target/playwright-bench/
          if-no-files-found: ignore

  allocation:
    # The per-frame allocation check, `bun run bench:allocation`, on S1 with each GPU path, by the
    # owner's ruling of 9 October 2026. Each GPU path takes a machine of its own, and the check is
    # the only work there, since a busy machine moves the figures. CI's Chromium draws on
    # SwiftShader, which draws S1's 100,000 boxes at under one frame a second, so the check draws
    # fewer boxes here, counts the frames that S1 steps, and judges them by CI's own budgets
    # (bench/allocation.ts). The Mac's gate keeps the full count on a real GPU. On SwiftShader the
    # browser optimizes after fewer calls, so the warm-up is 1,200 frames and the job takes about 4
    # minutes.
    name: allocation (${{ matrix.gpu }})
    needs: [build, city, changes]
    if: needs.changes.outputs.allocation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gpu: [webgpu, webgl2]
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: page-wasm
      - uses: ./.github/actions/playwright-chromium
      # The benchmark pages' build holds S6's pages, which load the city's files.
      - uses: ./.github/actions/samples
      - uses: ./.github/actions/city
        with:
          mode: download
      - name: Per-frame allocation in S1 on SwiftShader
        run: bun run bench:allocation --gpu ${{ matrix.gpu }}

  real-browsers:
    # Safari on GitHub's macOS machines and Firefox on its Linux machines, through the same test
    # pages, each browser in shards of its own. GitHub gives few macOS machines at once, so only
    # Safari, which runs only on macOS, takes them. Firefox runs under a virtual display and draws
    # WebGL2 with a software renderer. Neither browser gets a WebGPU adapter on these machines, so
    # a missing adapter is reported as a skip. The shards split the plan by each page's expected
    # time in Safari, and a unit test fails when a shard's pages would pass 10 minutes there.
    # Safari compiles the shader builds without the coat and sheen bit and a sample of those with
    # it, and Firefox compiles every build (D-147).
    # .dev/devices.md says what to do then. To add a shard, add it to the shard list and raise the
    # count beside it.
    # A draft pull request skips them, so that unfinished work holds no macOS machine (D-99).
    name: real-browsers (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [build, city, changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.browser == 'Safari' && 'macos-15' || 'ubuntu-latest' }}
    # Two of the seven Safari shards reached a verdict in each of the last two runs, in 13.4 to
    # 18.3 minutes. The other five were cut at the 20-minute limit, before any page. A shard spends
    # its first minutes starting the dev server and the browser, so the limit leaves room for that
    # as well as for a runner page that goes quiet.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [Safari, Firefox]
        shard: [1, 2, 3, 4, 5, 6, 7]
        shards: [7]
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: page-wasm
      - uses: ./.github/actions/samples
      # S6 loads the city's files, which the city job built.
      - uses: ./.github/actions/city
        with:
          mode: download
      - name: ${{ matrix.browser }}, shard ${{ matrix.shard }} of ${{ matrix.shards }}
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }} bun tests/real-browsers.ts --allow-no-webgpu ${{ matrix.browser == 'Safari' && '--shaders sampled' || '' }} --shard ${{ matrix.shard }}/${{ matrix.shards }} ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: real-browser-runs-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            target/runs/
            test-results/images/
          if-no-files-found: ignore

  generated-branch:
    # After a full run on main passes, the "generated" branch gets main's commit with every
    # generated file added, since main keeps none (D-105). Links that must work on GitHub point
    # there, such as the docs link in each engine error message. Only this job writes to the
    # repository, and main's rules cover only main. Each push replaces the branch's one commit.
    needs: ci-passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/bun-install
      # The engine's API reference names the shader features, which the shader modules hold.
      - uses: actions/download-artifact@v4
        with:
          name: page-wasm
      - name: Push main's commit and its generated files to the generated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bun tools/generate.ts --stage
          git commit -q -m "chore: generated files of ${GITHUB_SHA}"
          git push --force origin HEAD:refs/heads/generated

  ci-passed:
    # The one check of this workflow that main's rules require, so that the jobs above can split into
    # shards and change their names with no change to the rules. It runs after every other job, also
    # after a failure or a cancel, and fails unless each job passed. A job may skip only when the
    # changes job passed and its answer that gates the job is false: a docs-only pull request skips
    # every job but the build and docs-and-tools, a draft skips the full run's jobs, the allocation
    # job skips a pull request that changes nothing it checks, and the skill sketches job skips
    # every run but a docs-only one that changes them.
    if: always()
    needs:
      - changes
      - commits
      - docs-and-tools
      - rust-lint
      - rust-tests
      - build
      - size-base
      - wasm-checks
      - shader-compiler
      - packages
      - city
      - browser
      - browser-city
      - skill-sketches
      - bench
      - allocation
      - real-browsers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reading the run's jobs and their messages, to tell a time-out from a cancel.
    permissions:
      actions: read
      checks: read
    steps:
      # GitHub calls a job that hit its time limit "cancelled", as it calls a job that a newer push
      # cancelled. A time-out is a failure of the job, so this names it as one.
      - name: Which stopped jobs timed out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "cancelled") | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            if gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations" --jq '.[].message' | grep -q 'maximum execution time'; then
              echo "::error title=Timed out::$name hit its time limit, which is a failure"
            else
              echo "::warning title=Cancelled::$name was cancelled, by a newer push to main or by hand"
            fi
          done
      # Each job that may skip, and the changes job's answer that gates it, as in the job's condition.
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r '"changes: \(.changes.outputs)", (to_entries[] | "\(.key): \(.value.result)")' <<< "$NEEDS"
          jq -e '.changes.outputs as $run | {
              "rust-lint": "code", "rust-tests": "code", "size-base": "code", "wasm-checks": "code",
              "shader-compiler": "code", "packages": "code", "city": "full", "browser": "full",
              "browser-city": "full", "bench": "full", "real-browsers": "full",
              "allocation": "allocation", "skill-sketches": "sketches"
            } as $gate | length > 0 and all(to_entries[]; .value.result == "success"
              or (.value.result == "skipped" and $run[$gate[.key] // ""] == "false"))' \
            <<< "$NEEDS" > /dev/null
