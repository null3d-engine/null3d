# A test branch that never lands: one runner times browser shard 30 at the commit before the final
# pass's upscale build and at the commit after, in turn, from the two CI runs' own build files.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  BUN_VERSION: 1.4.3
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NULL3D_REQUIRE_FRESH_SHADERS: "1"
      NULL3D_PRODUCTION_PAGES: skip
      HUSKY: "0"
      CITY_TESTS: '\bs6 on '
      PWTEST_SHARD_WEIGHTS: "84:57:11:161:140:150:65:143:221:218:86:157:95:65:42:69:27:45:139:69:4:148:61:57:118:57:109:109:118:68:12"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: cp .github/diag/resize-timing.patch "$RUNNER_TEMP/"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: page-wasm
          run-id: 40019735250
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/A
      - uses: actions/download-artifact@v4
        with:
          name: page-wasm
          run-id: 40022423739
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/B
      - uses: ./.github/actions/playwright-chromium
      - uses: ./.github/actions/samples
      - name: Shard 30 at each commit in turn
        run: |
          set +e
          nproc; free -g; lscpu | grep -E "Model name|^CPU\(s\)"
          for round in B A B A; do
            if [ $round = A ]; then sha=b9fc91903f9324eaf8ed946334f13cd7902ec15d; else sha=16628a5dd90524ce8cf3a1d2112f561513cd1a86; fi
            git checkout -q -f $sha
            git apply "$RUNNER_TEMP/resize-timing.patch"
            rm -rf packages/engine/dist packages/vite-plugin/dist packages/cli/dist packages/engine/src/generated target/shader-modules.json test-results
            zstd -dc "$RUNNER_TEMP/$round/page-wasm.tar.zst" | tar -xf -
            echo "=== round $round at $sha"
            started=$(date +%s)
            RESIZE_TIMING_LOG="$RUNNER_TEMP/timing-$round.log" bun run test:browser --grep-invert "@alone|$CITY_TESTS" --shard=30/31 2>&1 | tee "$RUNNER_TEMP/round.log" | grep -E "✓|✘|passed|failed|flaky"
            echo "=== round $round took $(( $(date +%s) - started )) s"
            cat "$RUNNER_TEMP/timing-$round.log"
            rm -f "$RUNNER_TEMP/timing-$round.log"
          done
