name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each pull request on top of main and the pull requests ahead of it.
  merge_group:

permissions:
  contents: read

# A new push to a pull request cancels the run of its older push, so GitHub's few macOS machines
# test only the newest code. Runs on main and in the merge queue each have a group of their own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.3.14"
  # Anthropic's skill validator, pinned to one commit of anthropics/skills.
  SKILL_VALIDATOR_URL: https://raw.githubusercontent.com/anthropics/skills/1ed29a03dc852d30fa6ef2ca53a67dc2c2c2c563/skills/skill-creator/scripts/quick_validate.py

jobs:
  docs-and-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Git hooks are for local commits; this job runs the same checks directly.
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - name: Generated files are committed
        run: |
          bun run docs
          bun tools/skills.ts sync
          git status --porcelain
          test -z "$(git status --porcelain)"

      - run: bun run docs:check
      - run: bun run docs:style
      - run: bun run skills:check

      - name: Skill validator
        run: |
          pip install --quiet pyyaml
          curl -fsSL "$SKILL_VALIDATOR_URL" -o "$RUNNER_TEMP/quick_validate.py"
          for skill in skills/*/; do python3 "$RUNNER_TEMP/quick_validate.py" "$skill"; done

      - run: bun run check
      - run: bun run typecheck
      - run: bun run test

      - name: Commit messages and trailers
        if: github.event_name == 'pull_request'
        run: |
          bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
          bun tools/hooks/check-trailers.ts ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Clippy rejects a call to the system clock
        run: |
          if cargo clippy --manifest-path tools/fixtures/disallowed-clock/Cargo.toml --target-dir target/lint-fixture 2> clippy.log; then
            echo "Clippy accepted a call to SystemTime::now"
            exit 1
          fi
          grep -q 'disallowed method `std::time::SystemTime::now`' clippy.log

  wasm-and-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: "0"
    steps:
      # The size check finds its base in main's history and reads the commits since it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build both WebAssembly files and the shader compiler, and check their sizes against main's build
        run: bun run build:check-size
      - name: The shader compiler gives the native shader build's results
        run: bun run test:shader-compiler
      - name: Install Chromium for Playwright
        working-directory: tests
        run: bunx playwright install --with-deps chromium
      - name: The benchmark pages on SwiftShader
        run: bun run test:bench
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bench-test-results
          path: |
            test-results/
            target/playwright-bench/
          if-no-files-found: ignore

  browser:
    # The browser tests, the image test manifest among them, split into shards that run at once.
    # Add a shard when one takes more than about 10 minutes.
    name: browser (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install Chromium for Playwright
        working-directory: tests
        run: bunx playwright install --with-deps chromium
      - name: Browser tests on SwiftShader, WebGPU and WebGL2
        run: bun run test:browser --shard=${{ matrix.shard }}/2
      # The images that differ from their references, or have none yet, with their diffs:
      # bun run images:review --ci <run> fetches them.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  real-browsers-build:
    # The WebAssembly files that the Safari and Firefox jobs need, built once on Linux: the engine's
    # two files, and the shader compiler that the dev server runs on the WGSL in the test sketches.
    # The files are the same on every platform, and GitHub gives few macOS machines at once, so each
    # macOS job downloads them instead of spending more than a minute to build them again.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build the WebAssembly files that the test pages need
        run: bun tools/build-wasm.ts --pages-only
      - uses: actions/upload-artifact@v4
        with:
          name: page-wasm
          path: |
            packages/engine/dist/
            packages/vite-plugin/dist/
          if-no-files-found: error
          retention-days: 1

  real-browsers:
    # Safari and Firefox on GitHub's macOS machines, through the same test pages, each browser in a
    # job of its own. A missing WebGPU adapter or WebGL2 context is reported as a skip, because these
    # virtual machines may not give a browser one: Safari gets no WebGPU there, and Firefox no WebGL2.
    # One shard per browser keeps the fewest macOS machines busy; .dev/devices.md says when to add
    # one, by listing it in the matrix and raising the count in the name and the command.
    # Until 1.0, the browsers run only in the merge queue, once for each pull request before it
    # merges, because GitHub gives few macOS machines at once. Elsewhere the job passes at once on
    # Linux, so a pull request still reports the check that the merge queue requires.
    name: real-browsers (${{ matrix.browser }} ${{ matrix.shard }}/1)
    needs: real-browsers-build
    runs-on: ${{ github.event_name == 'merge_group' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [Safari, Firefox]
        shard: [1]
    env:
      HUSKY: "0"
      IN_QUEUE: ${{ github.event_name == 'merge_group' }}
    steps:
      - name: ${{ matrix.browser }} runs in the merge queue
        if: env.IN_QUEUE != 'true'
        run: echo "${{ matrix.browser }} runs when this pull request is in the merge queue."
      - uses: actions/checkout@v5
        if: env.IN_QUEUE == 'true'
      - uses: oven-sh/setup-bun@v2
        if: env.IN_QUEUE == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        if: env.IN_QUEUE == 'true'
      # The artifact holds both dist folders below packages/, their closest shared folder.
      - uses: actions/download-artifact@v4
        if: env.IN_QUEUE == 'true'
        with:
          name: page-wasm
          path: packages/
      # An app with the downloaded-file flag asks before its first launch, and nobody can answer.
      - name: Let Firefox open without the first-launch prompt
        if: env.IN_QUEUE == 'true' && matrix.browser == 'Firefox'
        run: xattr -dr com.apple.quarantine /Applications/Firefox.app || true
      - name: ${{ matrix.browser }}, shard ${{ matrix.shard }} of 1
        if: env.IN_QUEUE == 'true'
        run: bun tests/real-browsers.ts --allow-no-webgpu --allow-no-webgl2 --shard ${{ matrix.shard }}/1 ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: env.IN_QUEUE == 'true' && (failure() || cancelled())
        with:
          name: real-browser-runs-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            target/runs/
            test-results/images/
          if-no-files-found: ignore
