name: CI
"on":
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: "ci-${{ github.event_name == 'pull_request' && format('pr-{0}{1}', github.event.pull_request.number, github.event.action == 'ready_for_review' && '-full' || '') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}"
  cancel-in-progress: "${{ (github.event_name == 'pull_request' && github.event.action != 'ready_for_review') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}"
env:
  BUN_VERSION: 1.4.3
  SKILL_VALIDATOR_URL: https://raw.githubusercontent.com/anthropics/skills/1ed29a03dc852d30fa6ef2ca53a67dc2c2c2c563/skills/skill-creator/scripts/quick_validate.py
  SAVE_CACHES: true
  PUSH_BEFORE: "${{ github.event.before }}"
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: "${{ steps.paths.outputs.code }}"
      full: "${{ steps.paths.outputs.full }}"
      allocation: "${{ steps.paths.outputs.allocation }}"
      sketches: "${{ steps.paths.outputs.sketches }}"
    steps:
      - uses: actions/checkout@v5
        if: "github.event_name == 'pull_request'"
        with:
          fetch-depth: 2
      - name: Find what the pull request changes
        id: paths
        env:
          EVENT: "${{ github.event_name }}"
          DRAFT: "${{ github.event.pull_request.draft }}"
          DOCS: ^(\.dev/|docs/|skills/)|\.md$
          SKETCHES: ^(skills|docs/cookbook)/.*\.md$
          ALLOCATION: ^(packages/engine/src/(render|gpu|sketch|scene|shared)/|packages/(particles|terrain|impostors)/src/|crates/null3d-(core|render|wasm)/src/|bench/allocation\.ts$|bench/lib/(allocation|devtools|serve|source-names)\.ts$|bench/pages/null3d/|\.github/workflows/ci\.yml$)
        run: "code=true full=true allocation=true sketches=false\nif [ \"$EVENT\" = pull_request ]; then\n  files=$(git diff --name-only --no-renames HEAD^1 HEAD)\n  echo \"$files\"\n  if [ -n \"$files\" ] && ! grep -qvE \"$DOCS\" <<< \"$files\"; then code=false; fi\n  if [ \"$code\" = false ] || [ \"$DRAFT\" = true ]; then full=false; fi\n  if [ \"$full\" = false ] || ! grep -qE \"$ALLOCATION\" <<< \"$files\"; then allocation=false; fi\n  if [ \"$code\" = false ] && [ \"$DRAFT\" != true ] && grep -qE \"$SKETCHES\" <<< \"$files\"; then\n    sketches=true\n  fi\nfi\nprintf 'code=%s\\nfull=%s\\nallocation=%s\\nsketches=%s\\n' \"$code\" \"$full\" \"$allocation\" \"$sketches\" | tee -a \"$GITHUB_OUTPUT\"\n"
  shader-entries:
    name: "shader-entries (${{ matrix.shard }} of ${{ strategy.job-total }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "${{ env.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - id: keys
        run: "bun tools/shaders.ts --cache-keys | tee -a \"$GITHUB_OUTPUT\"\nif [ \"${{ github.ref_name }}\" = \"main\" ]; then\n  echo \"scope=\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"scope=branch-${{ github.ref_name }}-\" >> \"$GITHUB_OUTPUT\"\nfi\n"
      - name: Find the whole module set of these inputs
        id: whole
        uses: actions/cache/restore@v4
        with:
          path: "${{ steps.keys.outputs.modules-dir }}\n${{ steps.keys.outputs.entries-dir }}\n"
          key: "shaders-${{ runner.os }}-${{ steps.keys.outputs.stamp }}-${{ steps.keys.outputs.scope }}${{ steps.keys.outputs.inputs }}"
          lookup-only: true
      - name: Restore the entries that earlier runs compiled
        if: "steps.whole.outputs.cache-hit != 'true'"
        uses: actions/cache/restore@v4
        with:
          path: "${{ steps.keys.outputs.modules-dir }}\n${{ steps.keys.outputs.entries-dir }}\n"
          key: "shaders-${{ runner.os }}-${{ steps.keys.outputs.stamp }}-${{ steps.keys.outputs.scope }}${{ steps.keys.outputs.inputs }}"
          restore-keys: "shaders-${{ runner.os }}-${{ steps.keys.outputs.stamp }}-${{ steps.keys.outputs.scope }}\nshaders-${{ runner.os }}-${{ steps.keys.outputs.stamp }}-\n"
      - name: Install the pinned Rust toolchain
        if: "steps.whole.outputs.cache-hit != 'true'"
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: "steps.whole.outputs.cache-hit != 'true'"
        with:
          shared-key: "shader-build-${{ hashFiles('Cargo.toml') }}"
          save-if: false
      - name: "Compile this shard's shader entries into the per-entry cache"
        if: "steps.whole.outputs.cache-hit != 'true'"
        run: "bun tools/shaders.ts --entries-shard $(( ${{ matrix.shard }} - 1 ))/${{ strategy.job-total }} --entries-out target/shader-entries"
      - uses: actions/upload-artifact@v4
        if: "steps.whole.outputs.cache-hit != 'true'"
        with:
          name: "shader-entries-${{ matrix.shard }}"
          path: target/shader-entries/
          if-no-files-found: ignore
          retention-days: 1
  build:
    needs: shader-entries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HUSKY: "0"
    outputs:
      size-parts: "${{ steps.size-parts.outputs.parts }}"
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "shader-build-${{ hashFiles('Cargo.toml') }}"
          save-if: "${{ env.SAVE_CACHES == 'true' }}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "${{ env.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - id: entry-keys
        run: "bun tools/shaders.ts --cache-keys | tee -a \"$GITHUB_OUTPUT\""
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: shader-entries-*
          merge-multiple: true
          path: "${{ steps.entry-keys.outputs.entries-dir }}/${{ steps.entry-keys.outputs.stamp }}"
      - id: wasm-key
        run: "bun tools/build-wasm.ts --cache-key | tee -a \"$GITHUB_OUTPUT\""
      - uses: actions/cache/restore@v4
        id: wasm
        with:
          path: ~/.cache/null3d/wasm-artifacts
          key: "wasm-artifacts-${{ runner.os }}-${{ steps.wasm-key.outputs.key }}"
      - name: Build the shader modules and the WebAssembly files that the test pages need
        uses: ./.github/actions/shaders
        with:
          run: bun tools/build-wasm.ts --pages-only
      - uses: actions/cache/save@v4
        if: "steps.wasm.outputs.cache-hit != 'true' && env.SAVE_CACHES == 'true'"
        with:
          path: ~/.cache/null3d/wasm-artifacts
          key: "wasm-artifacts-${{ runner.os }}-${{ steps.wasm-key.outputs.key }}"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/null3d/size-memo
          key: "size-memo-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}"
          restore-keys: "size-memo-${{ runner.os }}-"
      - id: size-parts
        run: "parts=$(bun tools/lib/size-memo.ts --parts) || parts='[1,2,3,4]'\necho \"parts=$parts\" | tee -a \"$GITHUB_OUTPUT\"\n"
      - uses: ./.github/actions/archive
        with:
          mode: upload
          name: page-wasm
          paths: packages/engine/dist packages/vite-plugin/dist packages/cli/dist packages/engine/src/generated target/shader-modules.json
  load-pages:
    name: load pages
    needs:
      - build
      - changes
    if: "needs.changes.outputs.full == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NULL3D_REQUIRE_FRESH_SHADERS: "1"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "${{ env.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/archive
        with:
          mode: download
          name: page-wasm
      - uses: ./.github/actions/samples
      - uses: ./.github/actions/city
        with:
          mode: build
      - name: "The benchmark pages and the startup pages, built for production"
        run: bun tests/lib/load-server.ts
      - uses: ./.github/actions/archive
        with:
          mode: upload
          name: load-pages
          root: target
          paths: bench-pages startup-pages
          link: "true"
  diag:
    name: "diag (${{ matrix.gpu }})"
    needs:
      - build
      - load-pages
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gpu:
          - webgpu
          - webgl2
    env:
      NULL3D_REQUIRE_FRESH_SHADERS: "1"
      NULL3D_LOAD_PAGES: prebuilt
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "${{ env.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/archive
        with:
          mode: download
          name: page-wasm
      - uses: ./.github/actions/archive
        with:
          mode: download
          name: load-pages
          root: target
      - uses: ./.github/actions/playwright-chromium
      - uses: ./.github/actions/samples
      - uses: ./.github/actions/city
        with:
          mode: download
      - name: "Time S1 on SwiftShader: plain, 0.99 scale, sharpened, plain again"
        run: "set +e\nfor v in plain --scale99 --sharpen plain; do\n  flag=$v; [ \"$v\" = plain ] && flag=\n  echo \"== variant: $v\"\n  start=$(date +%s)\n  bun run bench:allocation --gpu ${{ matrix.gpu }} $flag > out.txt 2>&1\n  grep -E \"Warmed up|sampled .* frames|error\" out.txt | head -5\n  echo \"   job seconds: $(( $(date +%s) - start ))\"\ndone"