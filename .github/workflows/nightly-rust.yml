name: Newest Rust nightly

# Builds and tests with the newest nightly compiler once a week. The repository pins a nightly in
# rust-toolchain.toml; move the pin only after this job passes on the newer one.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.3"

jobs:
  newest-nightly:
    # The tests run as CI's rust-tests jobs run them: the test that builds every shader in a job of
    # its own beside every other test, and every failure reported.
    name: newest-nightly (${{ matrix.part }})
    runs-on: ubuntu-latest
    # Every CI job should take at most 15 minutes. These stop where CI's rust-tests parts stop.
    timeout-minutes: ${{ matrix.limit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: every test but the whole shader build
            id: ci
            tests: --workspace --profile ci
            limit: 35
          - part: the whole shader build
            id: whole-shader-build
            tests: -p null3d-shaders --test build --profile whole-shader-build
            limit: 135
    env:
      HUSKY: "0"
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - name: Install the newest nightly
        run: rustup toolchain install nightly --profile minimal --component rust-src,clippy,rustfmt --target wasm32-unknown-unknown
      - run: rustc --version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The cache's key holds the compiler's version, so it serves the runs on the same nightly, and
      # each new nightly builds the dependencies again.
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-${{ hashFiles('Cargo.toml') }}-${{ matrix.id }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - if: matrix.id == 'ci'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --no-fail-fast ${{ matrix.tests }}
      # nextest runs no documentation tests.
      - if: matrix.id == 'ci'
        run: cargo test --workspace --doc --no-fail-fast
      # The whole shader build test has built every shader with this nightly, so the build may take
      # them from main's shader cache. This workflow never saves it.
      - name: Both WebAssembly builds
        if: matrix.id == 'ci'
        uses: ./.github/actions/shaders
        with:
          run: bun run build
