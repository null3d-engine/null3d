name: Newest Rust nightly

# Builds and tests with the newest nightly compiler once a week. The repository pins a nightly in
# rust-toolchain.toml; move the pin only after this job passes on the newer one.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.3"

jobs:
  newest-nightly:
    runs-on: ubuntu-latest
    # Every CI job should take at most 15 minutes, and stops at 20. The tests run as CI's rust-tests job runs them.
    timeout-minutes: 20
    env:
      HUSKY: "0"
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - name: Install the newest nightly
        run: rustup toolchain install nightly --profile minimal --component rust-src,clippy,rustfmt --target wasm32-unknown-unknown
      - run: rustc --version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The cache's key holds the compiler's version, so it serves the runs on the same nightly, and
      # each new nightly builds the dependencies again.
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-${{ hashFiles('Cargo.toml') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      # nextest runs no documentation tests.
      - run: cargo test --workspace --doc
      - name: Both WebAssembly builds
        run: bun run build
