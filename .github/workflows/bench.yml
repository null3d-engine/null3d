name: Benchmarks

# Compares the speed of a new commit with a baseline. GitHub's shared machines change speed from
# run to run, so each machine runs both commits' benchmark pages in turns, and the run judges only
# that comparison. Linux machines build both commits once. Mac machines then split the pages into
# shards, each running both builds of its share, and a last job merges the shards into one report
# and one verdict. A shard that fails can run again alone. Each commit's pages run as a production
# build, as a developer ships the engine, so development checks count in neither. For a pull
# request it runs on demand, against the pull request's merge base: add the benchmark label, or
# start it from the Actions tab with the pull request's number.
#
# On main it runs once a day, on main's newest commit, against the last commit on main that a run
# measured, so one run measures every merge since then. Each run holds its Mac machines for about
# half an hour, and GitHub gives about 5 at once, which CI's Safari jobs need, so main gets no run
# for each push. When no merge came since the last measured commit, the run stops after choosing
# the commits, before any Mac machine starts. A run measured its commit when
# its report merged the shards into a whole comparison, whether the verdict passed or failed. So a
# slowdown fails the one run that holds it, and the next run compares with that commit. A cancelled
# run, a run whose builds failed and a run whose shards left pages out measured nothing, so the next
# day's run measures the same commits again. When the commits change the benchmark pages or the
# comparison's switches, the two builds measure in different ways: the run reports "measurement
# changed" and judges no time, but still fails a page that the new build could not run.
# .dev/benchmarks.md says how to read the summary and how to mark an
# expected slowdown.

on:
  # At 19:07 UTC: away from the top of the hour, when GitHub delays the most scheduled runs, and in
  # the hour with the fewest merges to main, when CI's Safari jobs need the Mac machines least.
  # GitHub runs a schedule on the default branch only.
  schedule:
    - cron: "7 19 * * *"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag, commit or pull request number to measure
        required: true
        default: main
      baseline:
        description: The commit to compare with. Empty takes the merge base with main, or the commit before on main
        required: false
        default: ""
      scenes:
        description: The scenes to compare, such as s6 or s5,s6, for a trial of a scene. Empty compares every scene
        required: false
        default: ""

permissions:
  contents: read
  # Main's baseline comes from this workflow's earlier runs.
  actions: read

# Main's scheduled runs share one group, so two never overlap, and main leaves GitHub's other Mac
# machines to pull requests. A running run is never cancelled; a newer scheduled run replaces a run
# that waits, and measures the waiting run's commits too. A pull request's newer run replaces its
# older one, and a run started by hand has a group of its own. A pull request run that the commits
# job skips, such as one for another label, also gets a group of its own, so it cancels nothing:
# the group repeats that job's condition.
concurrency:
  group: >-
    bench-${{ github.event_name == 'schedule' && 'main' ||
    github.event_name == 'pull_request' &&
    contains(github.event.pull_request.labels.*.name, 'benchmark') &&
    (github.event.action != 'labeled' || github.event.label.name == 'benchmark') &&
    format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.4.3"
  # git gives up on a transfer that stays under 1 KB/s for 30 s, and actions/checkout then fetches
  # again. Otherwise a stalled fetch waits for curl's own timeout: 23 s and then 11 minutes on a
  # Safari shard (run 40049563192), and 35 minutes on a Firefox shard's checkout, until the job's
  # limit cancelled it and held the whole run (run 40056066922).
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "30"
  # Only main's runs save caches here: each run saves the city's files under a key of its own, and
  # a branch's runs would multiply those copies. The shader action still saves a branch's own shader
  # entries, which CI's workflow saves on every run.
  SAVE_CACHES: ${{ github.ref == 'refs/heads/main' }}

jobs:
  commits:
    name: choose the commits
    # A pull request runs the benchmarks while it has the benchmark label, from the moment the label
    # is added. Every other job needs this one, so they are skipped with it. On main the job leaves
    # its outputs empty when main has not moved since the last measured commit, and the builds skip.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'benchmark') &&
      (github.event.action != 'labeled' || github.event.label.name == 'benchmark'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      baseline: ${{ steps.commits.outputs.baseline }}
      new: ${{ steps.commits.outputs.new }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Choose the baseline and the new commit
        id: commits
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_BASELINE: ${{ inputs.baseline }}
        run: |
          # A pull request's number, a branch, a tag or a commit, as a commit.
          resolve() {
            if [[ "$1" =~ ^[0-9]+$ ]]; then
              git fetch --quiet --no-tags origin "pull/$1/head"
              git rev-parse FETCH_HEAD
            elif git fetch --quiet --no-tags origin "$1" 2>/dev/null; then
              git rev-parse FETCH_HEAD
            else
              # The remote serves no short commit id, but the checkout holds the whole history.
              git rev-parse --verify "$1^{commit}"
            fi
          }
          # The merge base with main, or the commit before for a commit on main.
          merge_base() {
            local base
            base="$(git merge-base origin/main "$1")"
            if [ "$base" = "$1" ]; then git rev-parse "$1^"; else echo "$base"; fi
          }
          case "$EVENT" in
            schedule)
              new="$GITHUB_SHA"
              baseline="$(bun bench/ci-baseline.ts "$new")"
              if [ -z "$baseline" ]; then
                echo "Main has not moved since $(git log -1 --format='%h %s' "$new"), which a run measured."
                exit 0
              fi ;;
            pull_request)
              new="$PR_HEAD"
              baseline="$(git merge-base "origin/$PR_BASE" "$new")" ;;
            workflow_dispatch)
              new="$(resolve "$INPUT_REF")"
              if [ -n "$INPUT_BASELINE" ]; then baseline="$(resolve "$INPUT_BASELINE")"
              else baseline="$(merge_base "$new")"; fi ;;
          esac
          echo "Baseline: $(git log -1 --format='%h %s' "$baseline")"
          echo "New:      $(git log -1 --format='%h %s' "$new")"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

  build:
    # Each commit builds on a Linux machine of its own, with that commit's build script. The build's
    # files are the same on every platform, as CI's build job relies on too, so the Mac shards only
    # download them.
    name: build (${{ matrix.build }})
    needs: commits
    if: needs.commits.outputs.new != ''
    runs-on: ubuntu-latest
    # The job took 4 to 8 minutes. Every CI job should take at most 15 minutes. This one stops at 35
    # while a build that compiles every shader can take longer than 20.
    timeout-minutes: 35
    strategy:
      matrix:
        build: [baseline, new]
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.commits.outputs[matrix.build] }}
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # The job and the key match CI's build job, so a build here starts from main's cache of it.
      # The cache's own key leaves out the build profiles in the workspace's Cargo.toml, so a
      # profile change would keep restoring a cache built with the old profile.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}-shader-build
          save-if: ${{ env.SAVE_CACHES == 'true' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The checkout may be an older commit, without this repository's own install action.
      - uses: actions/cache/restore@v4
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache/save@v4
        if: env.SAVE_CACHES == 'true' && steps.bun-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # CI's shader caches serve this build too. An older commit, without the action, builds every
      # shader. The build stops before its size report, as CI's build job does: the report compressed
      # every shader module, 11 of the job's 15 minutes in run 40064495637, and no shard reads it. An
      # older commit, whose build script has no such mode, builds with its report.
      - if: hashFiles('.github/actions/shaders/action.yml') != ''
        uses: ./.github/actions/shaders
        with:
          run: |
            if grep -q -- "'--pages-only'" tools/build-wasm.ts; then bun tools/build-wasm.ts --pages-only; else bun run build; fi
      - if: hashFiles('.github/actions/shaders/action.yml') == ''
        run: |
          if grep -q -- "'--pages-only'" tools/build-wasm.ts; then bun tools/build-wasm.ts --pages-only; else bun run build; fi
      # The engine's WebAssembly files, the shader compiler and the shader modules with the record
      # of their inputs. An older commit may keep its shader modules in git, or lack the record. zstd
      # packs on every core, where gzip took about a minute on one.
      - name: Pack the build
        run: tar -cf - $(ls -d packages/*/dist packages/engine/src/generated target/shader-modules.json 2>/dev/null) | zstd -T0 -3 -q -o "$RUNNER_TEMP/build.tar.zst"
      # A rerun of a failed shard downloads these files again, so they stay as long as GitHub lets
      # a run's jobs run again.
      - uses: actions/upload-artifact@v4
        with:
          name: bench-build-${{ matrix.build }}
          path: ${{ runner.temp }}/build.tar.zst
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  shard:
    # The Mac machine draws with a real GPU, shared with other machines. On the Linux machine the
    # software GPU draws the larger scenes at under one frame per second and takes the processor
    # from the engine's threads, so its CPU times vary far more between identical builds. Each shard
    # runs every eighth page of the plan in both builds, and fails when its own pages fail. Every CI
    # job should take at most 15 minutes (it stops at 20), and two pages take about 9 minutes with
    # the setup.
    # .dev/benchmarks.md says how the count was chosen. To change it, change the list.
    name: benchmark (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: [commits, build]
    runs-on: macos-15
    # A shard runs both commits' pages. With a baseline whose final pass runs its upscale loops in
    # every build (D-236), all eight shards reach a 20-minute limit a second after printing their
    # verdict. Thirty leaves room for that pair.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      HUSKY: "0"
      BASELINE: ${{ needs.commits.outputs.baseline }}
      NEW: ${{ needs.commits.outputs.new }}
    steps:
      # The full history, from which the comparison reads the trailers of the commits between the
      # two builds.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/bun-install
      # S5's pages import their character from the sample content, so each build of the pages needs
      # it, even while the comparison leaves S5 out. This restores the checked-out commit's pin from
      # the Actions cache; the setup step below fetches each build's own pin.
      - uses: ./.github/actions/samples
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-build-*
          path: ${{ runner.temp }}/builds

      # Each build gets a worktree of its own, with its own packages, the files its build made and
      # the sample content that its own lock pins. Each pin has its own folder in the shared cache, so
      # a build whose pin matches the checked-out commit's finds its files ready, and a build with
      # another pin downloads that pin's files once.
      - name: Set up the baseline and the new build
        run: |
          set -o pipefail
          git fetch --quiet --no-tags origin "$BASELINE" "$NEW"
          for build in baseline new; do
            commit="$BASELINE"
            if [ "$build" = new ]; then commit="$NEW"; fi
            dir="$RUNNER_TEMP/$build"
            git worktree add --detach "$dir" "$commit"
            (cd "$dir" && bun install --frozen-lockfile && zstd -dc "$RUNNER_TEMP/builds/bench-build-$build/build.tar.zst" | tar -xf -)
            if [ -f "$dir/tools/samples/lock.json" ]; then (cd "$dir" && bun run samples:fetch); fi
          done

      # S6's city files take minutes to build and optimize, and each build of the pages needs them.
      # The cache keeps the built files and the optimized models of every build. The asset tool keys
      # each optimized model by its inputs and the tool, so an entry from another commit is never
      # used by mistake. Each run saves a new entry on main, and later runs restore the latest. The
      # key holds the module that builds the city files too, so files that an older version of it
      # built, under folder names that it no longer uses, are never restored.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/null3d/samples/city
            ~/.cache/null3d/bench-assets
          key: null3d-bench-city-${{ hashFiles('tools/samples/lock.json', 'bench/lib/city-files.ts') }}-${{ github.run_id }}
          restore-keys: null3d-bench-city-${{ hashFiles('tools/samples/lock.json', 'bench/lib/city-files.ts') }}-
      - name: Build S6's city files for each build that has S6
        run: |
          mkdir -p ~/.cache/null3d/bench-assets
          for build in baseline new; do
            dir="$RUNNER_TEMP/$build"
            [ -f "$dir/bench/lib/city-files.ts" ] || continue
            mkdir -p "$dir/node_modules/.cache"
            rm -rf "$dir/node_modules/.cache/null3d-assets"
            ln -s ~/.cache/null3d/bench-assets "$dir/node_modules/.cache/null3d-assets"
            (cd "$dir" && bun bench/lib/city-files.ts)
          done
      - uses: actions/cache/save@v4
        if: env.SAVE_CACHES == 'true'
        with:
          path: |
            ~/.cache/null3d/samples/city
            ~/.cache/null3d/bench-assets
          key: null3d-bench-city-${{ hashFiles('tools/samples/lock.json', 'bench/lib/city-files.ts') }}-${{ github.run_id }}

      # Rounds and run length: see "The benchmark job in CI" in .dev/benchmarks.md. The command builds
      # each commit's benchmark pages for production, and serves each build on a port of its own.
      # A run started by hand may name its scenes. It never sets main's baseline.
      - name: Run both builds' benchmark pages in turns, and compare them
        env:
          SCENES: ${{ inputs.scenes }}
        run: |
          rm -rf target/bench
          bun run bench:run --compare "$RUNNER_TEMP/baseline,$RUNNER_TEMP/new" --runs 10 --seconds 5 --shard ${{ matrix.shard }}/${{ strategy.job-total }} ${SCENES:+--scenes "$SCENES"}

      - name: Show the shard's summary on the job's page
        if: always()
        run: cat target/bench/*-compare/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      # A rerun of the shard replaces its record.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-shard-${{ matrix.shard }}
          path: target/bench/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

  report:
    # Merges the shards' records into the comparison of every page, with the verdict and the
    # Bench-Expected trailers. It runs when a shard fails too. It fails when a shard's record is
    # missing, so a rerun of the failed shards runs it again, and when the verdict fails.
    name: benchmark report
    needs: [commits, shard]
    if: ${{ !cancelled() && (needs.shard.result == 'success' || needs.shard.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/bun-install
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-shard-*
          path: target/bench/shards

      # Main's later runs read this step's result: a success means that the run measured its
      # commit. It fails only when a shard's record is missing, and the next step gives the verdict.
      - name: Merge the shards into one comparison
        run: bun run bench:run --merge target/bench/shards

      - name: Judge the new build
        run: |
          summary="$(ls target/bench/*-compare/summary.json)"
          if ! jq -e '.verdict.pass' "$summary" > /dev/null; then
            jq -r '"The new build fails:", (.verdict.failures[] | "- " + .)' "$summary"
            exit 1
          fi

      - name: Show the summary on the job's page
        if: always()
        run: |
          cat target/bench/*-compare/summary.md >> "$GITHUB_STEP_SUMMARY" ||
            echo "No report: the merge step's log says which shard records are missing." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks-${{ needs.commits.outputs.new }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/bench/
          if-no-files-found: ignore
          retention-days: 90
