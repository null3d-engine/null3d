name: Release

# Started by hand: opens a pull request that sets the next version everywhere and adds its section
# to CHANGELOG.md. Merging that pull request runs release-publish.yml, which tags the release
# branch's commit, publishes the GitHub Release and publishes the npm packages (.dev/releases.md).
# The release holds main up to the commit it starts from, and its notes list every commit since the
# last release up to that one.

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: Version bump. Auto releases a patch; pick minor or major when a roadmap release is done.
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      commit:
        description: The main commit to release, whose full CI run passed. Empty releases main's newest commit.
        type: string
        default: ""

permissions:
  contents: write # push the release branch
  pull-requests: write # open the release pull request
  actions: read # read the CI result for main's HEAD

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.3"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    env:
      # Git hooks are for local commits; the release commit carries its own trailers.
      HUSKY: "0"
    steps:
      # A pull request opened with the default GITHUB_TOKEN starts no workflows, so its CI would
      # never run. A GitHub App token opens it instead. The app needs Contents and Pull requests
      # write access, and the repository needs the RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY secrets.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify the commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse HEAD) is not on main."
            exit 1
          fi

      # A full CI run of the commit must have passed: main's own run after the push, or a run
      # started by hand. The newest of them counts. Both run every job. A push to main cancels
      # main's own run, but not one started by hand, so start one on the commit to release:
      #   gh workflow run ci.yml --ref main
      - name: Verify CI passed for the commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(git rev-parse HEAD)"
          conclusion="$(gh run list --workflow=ci.yml --commit="$sha" --json event,conclusion \
            --jq 'map(select(.event == "push" or .event == "workflow_dispatch")) | first | .conclusion // "no run"')"
          echo "The newest full CI run of $sha: ${conclusion}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::The newest full CI run of $sha concluded '${conclusion}', not success. Start one with gh workflow run ci.yml --ref main, then release the commit it ran on."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Set the version and write the changelog
        id: release
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: bun run release --release-type "$RELEASE_TYPE" --apply

      - name: Push the release branch and open the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ steps.release.outputs.changelog }}
        run: |
          branch="release/${VERSION}"

          # A release branch is generated and disposable. To add work to a release, merge it to
          # main and run this workflow again, which replaces any open release pull request.
          stale="$(gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release/")) | .number')"
          for pr in $stale; do
            echo "Closing the older release pull request #${pr}"
            gh pr close "$pr" --delete-branch || true
          done
          git push origin --delete "$branch" 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore(release): ${VERSION}" -m "$(printf '%s\n%s' \
            'Docs-Checked: release commit; it changes only version numbers and CHANGELOG.md' \
            'Skills-Checked: release commit; no skill shows the version number')"
          git push -u origin "$branch"

          gh label create release --color 0e8a16 --description "Release pull request" --force || true
          body="$(printf 'Release **%s**.\n\nReview the changelog below and edit `CHANGELOG.md` on this branch if a line needs it. Merging tags the release, publishes the GitHub Release and publishes the npm packages.\n\n---\n\n%s' "$VERSION" "$NOTES")"
          gh pr create --base main --head "$branch" --title "chore(release): ${VERSION}" \
            --label release --body "$body"
