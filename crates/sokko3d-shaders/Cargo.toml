[package]
name = "sokko3d-shaders"
description = "The WGSL shader library, import resolution, GLSL translation and reflection."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
naga = { version = "30", features = ["wgsl-in", "wgsl-out", "glsl-out"] }
naga_oil = { version = "0.23", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "1"

[lints]
workspace = true
