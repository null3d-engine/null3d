[package]
name = "null3d-shaders"
description = "The WGSL shader library, import resolution, GLSL translation and reflection."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
null3d-gpu = { path = "../null3d-gpu" }
naga = { version = "30", features = ["wgsl-in", "wgsl-out", "glsl-out"] }
naga_oil = { version = "0.23", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "1"

# The per-entry cache stores each compiled entry as JSON, the same records that the shader
# compiler sends. Only the native build command reads and writes it; the shader compiler, which a
# page or a bundler loads, is built for WebAssembly and leaves it out. The build tests compare
# their results with the shader compiler's JSON too.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "1"

[lints]
workspace = true
