# The shader manifest. The shader build (cargo run -p null3d-shaders --bin shader-build) builds
# every variant listed here into packages/engine/src/generated/shaders.ts and the device modules
# beside it. Git ignores those files: `bun run shaders`, and every command that reads them, runs
# the build when they are missing or out of date.
#
# Each [shaders.<name>] table is one entry shader:
#
#   file       The WGSL file, relative to wgsl/. Every .wgsl file there needs a table.
#   by_device  true for a shader that the engine loads by device. Its builds go into the device
#              modules, generated/shaders-<target>[-<bit>...].ts, one for each target and each
#              value of the permutation bits that a device fixes (DEVICE in the `permutation`
#              module): the draw index, tone mapping in the shader and half precision. A page
#              loads one of them, so it downloads only the builds that its device draws with. Each
#              variant of such a shader has one target. Other shaders stay in shaders.ts, each an
#              export of its own.
#   pipelines  Render pipelines by name, each a vertex and a fragment entry point. WebGL2 gets one
#              GLSL program for each pipeline, and WebGPU gets the entry point names. Needed when a
#              variant targets "glsl".
#   variants   Variants of the shader by name. Each has:
#                defs          naga_oil shader defs that are true in every build of the variant,
#                              for `#ifdef NAME`.
#                permutations  Permutation bits by name, as the `permutation` module of
#                              crates/null3d-gpu/src/drawlist.rs names them. The variant builds once
#                              for each combination of them, with the names of the bits it has as
#                              more shader defs. The build without any bit takes the variant's name,
#                              and each other build adds the names of its bits in lowercase, in bit
#                              order, such as `webgl2_draw_index`. Each build records its bits as
#                              its permutation word, which the backends pick it by.
#                targets       "wgsl" for WebGPU, "glsl" for WebGL2 (GLSL ES 3.00), or both.
#   custom_materials  True for the one template that custom materials build with: the shader
#              compiler adds a material's WGSL after the file's last line, and builds every variant
#              with the shader def of each function that the WGSL declares (CUSTOM_SURFACE for
#              `fn surface`). The shader compiler holds this manifest and the entry shaders.
#
# Names of shaders, variants and pipelines use letters, digits and underscores and do not start
# with a digit, because they become TypeScript property names.
#
# Library modules live in wgsl/lib/. The module in lib/<name>.wgsl starts with
# `#define_import_path null3d::<name>`, and shaders import it with `#import null3d::<name>`.
# The composer reads any name that equals an imported module's <name> as that module, so a
# shader that imports null3d::color cannot also have a variable called `color`. In the same way, a
# shader that imports an item by name, as `#import null3d::mesh::{material_of}`, cannot use that
# name for anything else, not even a struct field. The composer also refuses names in a library
# module that end in a digit, such as a field called `row0`.
# WGSL directives such as `enable` and `requires` go on the first lines of a file, above every
# `#import` and `#define_import_path` line: the composer passes them on only from there.
#
# HALF builds do their color math at half precision, with the library module null3d::half. It
# uses 16-bit floats, which only WGSL builds of the HALF bit get as written: the engine loads them
# only where the device has `shader-f16`. Every other build gets the module with 32-bit floats,
# and on WebGL2 its functions run at `mediump`. A variant with HALF has one target. Custom
# materials build without HALF.
#
# The build rejects WGSL language features other than packed_4x8_integer_dot_product,
# pointer_composite_access and readonly_and_readwrite_storage_textures, and flat interpolation
# other than `@interpolate(flat, either)` (AGENTS.md hard rule 10). A variant whose only target is
# "glsl" may read `@builtin(draw_index)`: its vertex shader reads `gl_DrawID` from
# WEBGL_multi_draw, which WebGPU does not have.

# The templates of meshes drawn by instance, one file each. Each builds for WebGPU, and for WebGL2
# with and without the draw index of WEBGL_multi_draw: WebGL2 reads instances from data textures,
# one draw per bucket, or many buckets in one multi-draw call. The TONE_MAP builds tone map and
# encode their color themselves, for the 8-bit path. The library module null3d::mesh holds what
# they share. They load by device, with the culling shader.

# The standard material, lit like three.js's MeshStandardMaterial. VERTEX_COLOR multiplies the
# base color by the mesh's vertex colors, and ALPHA_MASK discards the fragments whose alpha falls
# below the material's cutoff, as glTF's alpha mode MASK and three.js's alphaTest do. Only masked
# materials pay for the discard, which keeps the GPU's early depth test for the others.
# RECEIVE_SHADOWS reads the main directional light's shadow maps. Custom materials build this
# template.
[shaders.lit]
file = "lit.wgsl"
by_device = true
custom_materials = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK", "RECEIVE_SHADOWS", "HALF"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["DRAW_INDEX", "TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK", "RECEIVE_SHADOWS", "HALF"], targets = ["glsl"] }

# The standard material with its texture maps, from the same file: base color, metal-rough, normal,
# occlusion, emissive and light maps. VERTEX_TANGENT takes the normal map's frame from the mesh's
# tangents, and VERTEX_COLOR, ALPHA_MASK and RECEIVE_SHADOWS act as for the standard material.
[shaders.standard_maps]
file = "lit.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { defs = ["MAPS"], permutations = ["TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK", "RECEIVE_SHADOWS", "VERTEX_TANGENT", "HALF"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2", "MAPS"], permutations = ["DRAW_INDEX", "TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK", "RECEIVE_SHADOWS", "VERTEX_TANGENT", "HALF"], targets = ["glsl"] }

# The material's color alone, like three.js's MeshBasicMaterial, times the mesh's vertex colors
# with VERTEX_COLOR. ALPHA_MASK as for the standard material.
[shaders.unlit]
file = "unlit.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["DRAW_INDEX", "TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK"], targets = ["glsl"] }

# The material's color times its map, like three.js's MeshBasicMaterial with a map, times the
# mesh's vertex colors with VERTEX_COLOR. ALPHA_MASK as for the standard material.
[shaders.unlit_map]
file = "unlit_map.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["DRAW_INDEX", "TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK"], targets = ["glsl"] }

# Colored by the first texture coordinates, for the engine's own tests of vertex formats.
[shaders.texcoords]
file = "texcoords.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["TONE_MAP"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["DRAW_INDEX", "TONE_MAP"], targets = ["glsl"] }

# The final pass: one triangle over the canvas, which scales the scene color up to it and tone
# maps HDR color. The FXAA builds smooth edges first, for the FXAA anti-aliasing mode. The WebGL2
# variant counts rows from the bottom. It loads by device, in every module of its target.
[shaders.final]
file = "final.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["FXAA", "HALF"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["FXAA", "HALF"], targets = ["glsl"] }

# Debug lines, which development builds of the engine draw after the opaque objects: a position
# relative to the camera and an sRGB color per vertex, from a vertex buffer of their own. It stays
# in shaders.ts, where only development builds import it, so release builds hold none of it.
[shaders.debug_lines]
file = "debug_lines.wgsl"
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["TONE_MAP"], targets = ["wgsl"] }
variants.webgl2 = { permutations = ["TONE_MAP"], targets = ["glsl"] }

# The debug views, which development builds of the engine draw in place of every material: the
# normals, the depth, the overdraw or the wireframe, by the two debug view bits, or the shadows, by
# RECEIVE_SHADOWS, with the low bit on surfaces that receive none. It reads each
# instance as the mesh templates do, and stays in shaders.ts, where only development builds import
# it, so release builds hold none of it.
[shaders.debug_view]
file = "debug_view.wgsl"
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["TONE_MAP", "RECEIVE_SHADOWS", "DEBUG_VIEW_LOW", "DEBUG_VIEW_HIGH"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["DRAW_INDEX", "TONE_MAP", "RECEIVE_SHADOWS", "DEBUG_VIEW_LOW", "DEBUG_VIEW_HIGH"], targets = ["glsl"] }

# The depth of shadow casters, drawn from the main directional light into one cascade's layer of
# the shadow map. The PREPASS builds draw the depth of a camera's opaque objects for the depth
# prepass, and clip what lies in front of the camera as the templates that shade do.
[shaders.shadow_depth]
file = "shadow_depth.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["PREPASS"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["DRAW_INDEX", "PREPASS"], targets = ["glsl"] }

# GPU culling into buckets for indirect draws; its compute entry point is `main`. WebGPU only.
[shaders.cull]
file = "cull.wgsl"
by_device = true
variants.webgpu = { targets = ["wgsl"] }

# The mip levels of a layer of a texture array, one render pass per level. It loads by device, as
# the backends make the mip levels of textures that the scene uploads. The copy pipeline copies a
# layer texel by texel, for the WebGL2 backend.
[shaders.mipmap]
file = "mipmap.wgsl"
by_device = true
pipelines.main = { vertex = "vs_main", fragment = "fs_main" }
pipelines.copy = { vertex = "vs_main", fragment = "fs_copy" }
variants.webgpu = { targets = ["wgsl"] }
variants.webgl2 = { targets = ["glsl"] }

# A texture behind every object, drawn first in the camera's opaque pass as one triangle over the
# whole view. It loads by device, with the mesh templates, and its TONE_MAP builds tone map and
# encode their color themselves, for the 8-bit path.
[shaders.background]
file = "background.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["TONE_MAP"], targets = ["wgsl"] }
variants.webgl2 = { permutations = ["TONE_MAP"], targets = ["glsl"] }

# The GPU timer's start mark, one invocation that does nothing; its compute entry point is `main`.
# WebGPU only. It stays in shaders.ts, where the GPU timer imports it.
[shaders.timer_mark]
file = "timer_mark.wgsl"
variants.webgpu = { targets = ["wgsl"] }

# A test shader for the GPU layer's texture commands, which the texture replay test page draws
# with. The engine does not import it, so its download does not hold it.
[shaders.test_textures]
file = "test_textures.wgsl"
pipelines.sample = { vertex = "vs_main", fragment = "fs_sample" }
pipelines.solid = { vertex = "vs_main", fragment = "fs_solid" }
variants.webgpu = { targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], targets = ["glsl"] }

# A test shader for the shader library, which the library test page draws with: each case runs one
# library function on the GPU. Each variant holds the functions of one library module, so that no
# driver has to compile the whole library as one shader. The engine does not import it, so its
# download does not hold it.
[shaders.test_library]
file = "test_library.wgsl"
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.color = { defs = ["COLOR"], targets = ["wgsl", "glsl"] }
variants.depth = { defs = ["DEPTH"], targets = ["wgsl", "glsl"] }
variants.fog = { defs = ["FOG"], targets = ["wgsl", "glsl"] }
variants.lighting = { defs = ["LIGHTING"], targets = ["wgsl", "glsl"] }
variants.math = { defs = ["MATH"], targets = ["wgsl", "glsl"] }
variants.noise = { defs = ["NOISE"], targets = ["wgsl", "glsl"] }
variants.sdf = { defs = ["SDF"], targets = ["wgsl", "glsl"] }
variants.vertex = { defs = ["VERTEX"], targets = ["wgsl", "glsl"] }

# A test shader for the build itself.
[shaders.test_mesh]
file = "test_mesh.wgsl"
pipelines.main = { vertex = "vs_main", fragment = "fs_main" }
variants.plain = { targets = ["wgsl", "glsl"] }
variants.instanced = { defs = ["INSTANCED"], targets = ["wgsl", "glsl"] }
variants.multi_draw = { defs = ["INSTANCED", "DRAW_INDEX"], targets = ["glsl"] }

# Light clustering on the GPU: three compute entry points, `count_lights`, `place_lights` and
# `write_lights`, that list each cluster's point and spot lights in the light grid. WebGPU only;
# on WebGL2 the job workers list them.
[shaders.light_clusters]
file = "light_clusters.wgsl"
by_device = true
variants.webgpu = { targets = ["wgsl"] }
