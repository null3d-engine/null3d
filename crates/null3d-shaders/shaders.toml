# The shader manifest. The shader build (cargo run -p null3d-shaders --bin shader-build) builds
# every variant listed here into packages/engine/src/generated/shaders.ts and the device modules
# beside it. Git ignores those files: `bun run shaders`, and every command that reads them, runs
# the build when they are missing or out of date.
#
# Each [shaders.<name>] table is one entry shader:
#
#   file       The WGSL file, relative to wgsl/. Every .wgsl file there needs a table.
#   by_device  true for a shader that the engine loads by device. Its builds go into the device
#              modules, generated/shaders-<target>[-<bit>...].js, one for each target and each
#              value of the permutation bits that a device fixes (DEVICE in the `permutation`
#              module): the draw index, tone mapping in the shader and half precision. A page
#              loads one of them, so it downloads only the builds that its device draws with. Each
#              variant of such a shader has one target. Other shaders stay in shaders.ts, each an
#              export of its own.
#   pipelines  Render pipelines by name, each a vertex and a fragment entry point. WebGL2 gets one
#              GLSL program for each pipeline, and WebGPU gets the entry point names. Needed when a
#              variant targets "glsl".
#   variants   Variants of the shader by name. Each has:
#                defs          naga_oil shader defs that are true in every build of the variant,
#                              for `#ifdef NAME`.
#                permutations  Permutation bits by name, as the `permutation` module of
#                              crates/null3d-gpu/src/drawlist.rs names them. The variant builds once
#                              for each combination of them, with the names of the bits it has as
#                              more shader defs. The build without any bit takes the variant's name,
#                              and each other build adds the names of its bits in lowercase, in bit
#                              order, such as `webgl2_draw_index`. Each build records its bits as
#                              its permutation word, which the backends pick it by.
#                targets       "wgsl" for WebGPU, "glsl" for WebGL2 (GLSL ES 3.00), or both.
#   first_use  true for a shader that the engine loads on a feature's first use. Its builds go into
#              a module of their own for each target, generated/shaders-<name>-<target>.ts, which
#              the feature's code imports, and not into shaders.ts or the device modules. So no
#              page downloads them before it asks for the feature. Each variant has one target.
#   custom_materials  True for the one template that custom materials build with: the shader
#              compiler adds a material's WGSL after the file's last line, and builds every variant
#              with the shader def of each function that the WGSL declares (CUSTOM_SURFACE for
#              `fn surface`). The shader compiler holds this manifest and the entry shaders.
#   custom_effects  True for the one template that custom effects build with. It is a template
#              only: the build checks that it builds, with an effect that keeps each pixel, and
#              writes no module of it. The shader compiler adds an effect's WGSL after its last
#              line, and builds every variant with the shader def CUSTOM_EFFECT.
#   custom_tone_curves  True for the one shader that custom tone curves build with, the final
#              pass: the shader compiler adds a curve's WGSL after its last line, and builds every
#              variant but its HALF builds with the shader def CUSTOM_TONE_CURVE.
#
# Names of shaders, variants and pipelines use letters, digits and underscores and do not start
# with a digit, because they become TypeScript property names.
#
# Library modules live in wgsl/lib/. The module in lib/<name>.wgsl starts with
# `#define_import_path null3d::<name>`, and shaders import it with `#import null3d::<name>`.
# The composer reads any name that equals an imported module's <name> as that module, so a
# shader that imports null3d::color cannot also have a variable called `color`. In the same way, a
# shader that imports an item by name, as `#import null3d::mesh::{material_of}`, cannot use that
# name for anything else, not even a struct field. The composer also refuses names in a library
# module that end in a digit, such as a field called `row0`.
# WGSL directives such as `enable` and `requires` go on the first lines of a file, above every
# `#import` and `#define_import_path` line: the composer passes them on only from there.
#
# HALF builds do their color math at half precision, with the library module null3d::half. It
# uses 16-bit floats, which only WGSL builds of the HALF bit get as written: the engine loads them
# only where the device has `shader-f16`. Every other build gets the module with 32-bit floats,
# and on WebGL2 its functions run at `mediump`. A variant with HALF has one target. Custom
# materials build without HALF.
#
# The build rejects WGSL language features other than packed_4x8_integer_dot_product,
# pointer_composite_access and readonly_and_readwrite_storage_textures, and flat interpolation
# other than `@interpolate(flat, either)` (AGENTS.md hard rule 10). A variant whose only target is
# "glsl" may read `@builtin(draw_index)`: its vertex shader reads `gl_DrawID` from
# WEBGL_multi_draw, which WebGPU does not have.
#
# Each [first_use.<feature>] table names a feature whose builds load on first use: a page that
# never uses the feature downloads none of them. The feature's builds go into device modules of
# their own, generated/shaders-<feature>-<target>[-<bit>...].js, one for each target and each value
# of the device's bits that those builds vary in. The engine loads one the first time a pipeline
# asks for one of its builds, and the pipeline waits for it as for a custom material's shader.
#
#   shaders  Shaders that load by device, each of whose builds belongs to the feature: its templates.
#   bits     Permutation bits that a device does not fix: each build of a shader that loads by
#            device with one of them belongs to the feature, such as the final pass's BLOOM builds.
#
# A build with no feature stays in the device modules of the start. A build of a feature's shader
# belongs to that feature, and any other build to the feature of its lowest bit that a feature
# names. The template of custom materials stays at the start. The size check holds each module of
# a feature to the start shader file's own limit after Brotli.
#
# Device modules are plain JavaScript, which the main module imports by address, so a production
# build holds one copy of each for the page and every worker.
#
# A new feature that adds templates or bits adds its table here. A full-screen pass, or a pass whose
# output other passes read, must not draw until its pipelines are built, as bloom's and skinning's
# do, since a pipeline that waits for its file draws nothing (decision record D-56).

# The SKIN builds skin each vertex by its joints in the vertex shader, and the MORPH builds, which
# only WebGL2 has, add its morph targets' deltas before that. WebGPU skins and morphs in the
# skinning pass instead, apart from the SKIN builds that its vertex skinning switch draws with.
#
# The templates of meshes drawn by instance, one file each. Each builds for WebGPU, and for WebGL2
# with and without the draw index of WEBGL_multi_draw: WebGL2 reads instances from data textures,
# one draw per bucket, or many buckets in one multi-draw call. The TONE_MAP builds tone map and
# encode their color themselves, for the 8-bit path. The library module null3d::mesh holds what
# they share. They load by device, with the culling shader.

# The standard material, lit like three.js's MeshStandardMaterial. VERTEX_COLOR multiplies the
# base color by the mesh's vertex colors, and ALPHA_MASK discards the fragments whose alpha falls
# below the material's cutoff, as glTF's alpha mode MASK and three.js's alphaTest do. Only masked
# materials pay for the discard, which keeps the GPU's early depth test for the others.
# RECEIVE_SHADOWS reads the main directional light's shadow maps. Custom materials build this
# template.
[shaders.lit]
file = "lit.wgsl"
by_device = true
custom_materials = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK", "RECEIVE_SHADOWS", "SKIN", "HALF"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["DRAW_INDEX", "TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK", "RECEIVE_SHADOWS", "HALF", "SKIN", "MORPH"], targets = ["glsl"] }

# The standard material with its texture maps, from the same file: base color, metal-rough, normal,
# occlusion, emissive, light and specular maps, which share six texture units on WebGL2.
# VERTEX_TANGENT takes the normal map's frame from the mesh's tangents, and VERTEX_COLOR, ALPHA_MASK
# and RECEIVE_SHADOWS act as for the standard material.
[shaders.standard_maps]
file = "lit.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { defs = ["MAPS", "JOINTS_AFTER_MAPS"], permutations = ["TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK", "RECEIVE_SHADOWS", "SKIN", "VERTEX_TANGENT", "HALF"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2", "MAPS"], permutations = ["DRAW_INDEX", "TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK", "RECEIVE_SHADOWS", "VERTEX_TANGENT", "HALF", "SKIN", "MORPH"], targets = ["glsl"] }

# The material's color alone, like three.js's MeshBasicMaterial, times the mesh's vertex colors
# with VERTEX_COLOR. ALPHA_MASK as for the standard material.
[shaders.unlit]
file = "unlit.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK", "SKIN"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["DRAW_INDEX", "TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK", "SKIN", "MORPH"], targets = ["glsl"] }

# The material's color times its map, like three.js's MeshBasicMaterial with a map, times the
# mesh's vertex colors with VERTEX_COLOR. ALPHA_MASK as for the standard material.
[shaders.unlit_map]
file = "unlit_map.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { defs = ["JOINTS_AFTER_MAPS"], permutations = ["TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK", "SKIN"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["DRAW_INDEX", "TONE_MAP", "VERTEX_COLOR", "ALPHA_MASK", "SKIN", "MORPH"], targets = ["glsl"] }

# Sprites, like three.js's Sprite with a SpriteMaterial: quads of a sprite batch's rows that face
# the camera, in the material's color times each sprite's color. ALPHA_MASK as for the standard
# material.
[shaders.sprite]
file = "sprite.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["TONE_MAP", "ALPHA_MASK"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["DRAW_INDEX", "TONE_MAP", "ALPHA_MASK"], targets = ["glsl"] }

# Sprites times the material's map at each sprite's frame of the atlas, from the same file.
[shaders.sprite_map]
file = "sprite.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { defs = ["MAP"], permutations = ["TONE_MAP", "ALPHA_MASK"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2", "MAP"], permutations = ["DRAW_INDEX", "TONE_MAP", "ALPHA_MASK"], targets = ["glsl"] }

# A page downloads the sprite templates with its first sprite batch.
[first_use.sprites]
shaders = ["sprite", "sprite_map"]

# Wide lines, like three.js's Line2 and LineSegments2 with a LineMaterial: a quad with round ends
# for each segment of a line batch's rows, in the material's color times the segment's colors,
# with widths in CSS pixels or world units and dashes.
[shaders.line]
file = "line.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["TONE_MAP"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["DRAW_INDEX", "TONE_MAP"], targets = ["glsl"] }

# Lit wide lines, from the same file: the lines of a standard material, lit as a surface of the
# line's color that faces the camera.
[shaders.line_lit]
file = "line.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { defs = ["LIT"], permutations = ["TONE_MAP"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2", "LIT"], permutations = ["DRAW_INDEX", "TONE_MAP"], targets = ["glsl"] }

# A page downloads both line templates with its first line batch.
[first_use.lines]
shaders = ["line", "line_lit"]

# Colored by the first texture coordinates, for the engine's own tests of vertex formats.
[shaders.texcoords]
file = "texcoords.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["TONE_MAP"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["DRAW_INDEX", "TONE_MAP", "SKIN"], targets = ["glsl"] }

# Only the engine's own tests draw with it, so a page downloads it with the first mesh that does.
[first_use.texcoords]
shaders = ["texcoords"]

# The final pass: one triangle over the canvas, which scales the scene color up to it and tone
# maps HDR color. The FXAA builds smooth edges first, for the FXAA anti-aliasing mode. The BLOOM
# builds blend bloom's base level into the scene color before the tone mapping. The WebGL2 variant counts
# rows from the bottom. It loads by device, in every module of its target.
[shaders.final]
file = "final.wgsl"
by_device = true
custom_tone_curves = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["FXAA", "HALF", "BLOOM"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["FXAA", "HALF", "BLOOM"], targets = ["glsl"] }

# The template of custom effects: one triangle over the effect's target, which calls the effect's
# function for each pixel. It builds for WebGPU, where DEPTH_MULTISAMPLED reads a multisampled
# scene depth, and for WebGL2. Only effects build it: the build writes no module of it.
[shaders.effect]
file = "effect.wgsl"
custom_effects = true
pipelines.main = { vertex = "effect_vs", fragment = "effect_fs" }
variants.webgpu = { targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], targets = ["glsl"] }

# One step of bloom's mip chain: a 13-tap step down or a tent step up, as its uniform block says.
# Each step reads its source with a linear filter. A step up blends over its own level.
[shaders.bloom]
file = "bloom.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { targets = ["wgsl"] }
variants.webgl2 = { targets = ["glsl"] }

# A page downloads bloom's steps and the final pass's BLOOM builds when the sketch first turns
# bloom on.
[first_use.bloom]
shaders = ["bloom"]
bits = ["BLOOM"]

# The outline effect's mask: outlined objects drawn as instanced meshes, which mark every part of
# them, and with OUTLINE_VISIBLE the parts that nothing hides. It reads each instance as the mesh
# templates do, and loads by device with them. SKIN skins in the vertex shader, as the mesh
# templates' SKIN builds do.
[shaders.outline_mask]
file = "outline_mask.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["SKIN", "OUTLINE_VISIBLE"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["DRAW_INDEX", "OUTLINE_VISIBLE", "SKIN"], targets = ["glsl"] }

# Ambient occlusion's steps at a fraction of the render size, three.js's GTAOPass: `depth` copies
# one texel of the depth prepass's depth per pixel, `horizon` finds how open each surface is, and
# `denoise` blurs it along each surface. The opaque pass then reads the result (null3d::gtao). The
# WebGL2 variant counts rows from the bottom. They load by device, in every module of its target.
[shaders.ao]
file = "ao.wgsl"
by_device = true
pipelines.depth = { vertex = "vs", fragment = "depth" }
pipelines.horizon = { vertex = "vs", fragment = "horizon" }
pipelines.denoise = { vertex = "vs", fragment = "denoise" }
variants.webgpu = { targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], targets = ["glsl"] }

# The depth step from a multisampled depth target, from the same file: it reads sample 0. Only
# WebGPU reads multisampled textures; WebGL2 reads the one-sample copy that its backend keeps.
[shaders.ao_ms]
file = "ao.wgsl"
by_device = true
pipelines.depth = { vertex = "vs", fragment = "depth" }
variants.webgpu = { defs = ["MULTISAMPLED"], targets = ["wgsl"] }

# A page downloads ambient occlusion's steps when the sketch first turns it on. The frames keep the
# opaque pass without it until the steps' pipelines are built.
[first_use.ao]
shaders = ["ao", "ao_ms"]

# Debug lines, which development builds of the engine draw after the opaque objects: a position
# relative to the camera and an sRGB color per vertex, from a vertex buffer of their own. It stays
# in shaders.ts, where only development builds import it, so release builds hold none of it.
[shaders.debug_lines]
file = "debug_lines.wgsl"
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["TONE_MAP"], targets = ["wgsl"] }
variants.webgl2 = { permutations = ["TONE_MAP"], targets = ["glsl"] }

# The debug views, which development builds of the engine draw in place of every material: the
# normals, the depth, the overdraw or the wireframe, by the two debug view bits, or the shadows, by
# RECEIVE_SHADOWS, with the low bit on surfaces that receive none. It reads each
# instance as the mesh templates do, and stays in shaders.ts, where only development builds import
# it, so release builds hold none of it.
[shaders.debug_view]
file = "debug_view.wgsl"
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["TONE_MAP", "RECEIVE_SHADOWS", "DEBUG_VIEW_LOW", "DEBUG_VIEW_HIGH"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["DRAW_INDEX", "TONE_MAP", "RECEIVE_SHADOWS", "DEBUG_VIEW_LOW", "DEBUG_VIEW_HIGH", "SKIN", "MORPH"], targets = ["glsl"] }

# The depth of shadow casters, drawn from a light into one cascade's layer of the shadow map or one
# tile of the shadow atlas. The CASTER_OFFSET builds move casters that draw only their back faces
# toward the light. The PREPASS builds draw the depth of a camera's opaque objects for the depth
# prepass on WebGPU, and clip what lies in front of the camera as the templates that shade do.
# WebGL2 draws the prepass with each mesh template's own vertex shader instead.
[shaders.shadow_depth]
file = "shadow_depth.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["SKIN", "PREPASS", "CASTER_OFFSET"], targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], permutations = ["DRAW_INDEX", "CASTER_OFFSET", "SKIN", "MORPH"], targets = ["glsl"] }

# GPU culling into buckets for indirect draws; its compute entry point is `main`. WebGPU only.
[shaders.cull]
file = "cull.wgsl"
by_device = true
variants.webgpu = { targets = ["wgsl"] }

# The two phases of two-phase occlusion culling, from the same file: compute entry points `early`
# and `late`. WebGPU only.
[shaders.cull_occlusion]
file = "cull.wgsl"
by_device = true
variants.webgpu = { defs = ["OCCLUSION"], targets = ["wgsl"] }

# The mip levels of a layer of a texture array, one render pass per level. It loads by device, as
# the backends make the mip levels of textures that the scene uploads. The copy pipeline copies a
# layer texel by texel, for the WebGL2 backend.
[shaders.mipmap]
file = "mipmap.wgsl"
by_device = true
pipelines.main = { vertex = "vs_main", fragment = "fs_main" }
pipelines.copy = { vertex = "vs_main", fragment = "fs_copy" }
variants.webgpu = { targets = ["wgsl"] }
variants.webgl2 = { targets = ["glsl"] }

# Environment maps made on the GPU (D-19): the built-in room, traced from its center and blurred as
# three.js's examples blur it, or a panorama from an HDR file mapped onto the cube; then halved into
# a chain of levels, and filtered for each roughness, the six faces of one level per draw. It loads
# on first use, with the generator code that the thread that draws loads when a sketch first asks
# for the room or loads an HDR file.
[shaders.environment]
file = "environment.wgsl"
first_use = true
pipelines.trace = { vertex = "vs_main", fragment = "fs_trace" }
pipelines.blur = { vertex = "vs_main", fragment = "fs_blur" }
pipelines.half = { vertex = "vs_main", fragment = "fs_half" }
pipelines.prefilter = { vertex = "vs_main", fragment = "fs_prefilter" }
pipelines.panorama = { vertex = "vs_main", fragment = "fs_panorama" }
variants.webgpu = { targets = ["wgsl"] }
variants.webgl2 = { targets = ["glsl"] }

# A texture behind every object, drawn first in the camera's opaque pass as one triangle over the
# whole view. Its TONE_MAP builds tone map and encode their color themselves, for the 8-bit path.
[shaders.background]
file = "background.wgsl"
by_device = true
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.webgpu = { permutations = ["TONE_MAP"], targets = ["wgsl"] }
variants.webgl2 = { permutations = ["TONE_MAP"], targets = ["glsl"] }

# A page downloads it with its first background texture. The background appears once its pipeline
# is built, as it appears once the texture's texels are on the GPU.
[first_use.background]
shaders = ["background"]

# The GPU timer's start mark, one invocation that does nothing; its compute entry point is `main`.
# WebGPU only. It stays in shaders.ts, where the GPU timer imports it.
[shaders.timer_mark]
file = "timer_mark.wgsl"
variants.webgpu = { targets = ["wgsl"] }

# A test shader for the GPU layer's texture commands, which the texture replay test page draws
# with. The engine does not import it, so its download does not hold it.
[shaders.test_textures]
file = "test_textures.wgsl"
pipelines.sample = { vertex = "vs_main", fragment = "fs_sample" }
pipelines.solid = { vertex = "vs_main", fragment = "fs_solid" }
variants.webgpu = { targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], targets = ["glsl"] }

# A test shader for cube, 3D and high dynamic range textures, which the cube and 3D texture replay
# test page draws with. The engine does not import it, so its download does not hold it.
[shaders.test_cubes]
file = "test_cubes.wgsl"
pipelines.sample = { vertex = "vs_main", fragment = "fs_sample" }
pipelines.face = { vertex = "vs_face", fragment = "fs_solid" }
variants.webgpu = { targets = ["wgsl"] }
variants.webgl2 = { defs = ["WEBGL2"], targets = ["glsl"] }

# A test shader for the shader library, which the library test page draws with: each case runs one
# library function on the GPU. Each variant holds the functions of one library module, so that no
# driver has to compile the whole library as one shader. The engine does not import it, so its
# download does not hold it.
[shaders.test_library]
file = "test_library.wgsl"
pipelines.main = { vertex = "vs", fragment = "fs" }
variants.color = { defs = ["COLOR"], targets = ["wgsl", "glsl"] }
variants.depth = { defs = ["DEPTH"], targets = ["wgsl", "glsl"] }
variants.fog = { defs = ["FOG"], targets = ["wgsl", "glsl"] }
variants.lighting = { defs = ["LIGHTING"], targets = ["wgsl", "glsl"] }
variants.math = { defs = ["MATH"], targets = ["wgsl", "glsl"] }
variants.noise = { defs = ["NOISE"], targets = ["wgsl", "glsl"] }
variants.sdf = { defs = ["SDF"], targets = ["wgsl", "glsl"] }
variants.vertex = { defs = ["VERTEX"], targets = ["wgsl", "glsl"] }

# A test shader for the build itself.
[shaders.test_mesh]
file = "test_mesh.wgsl"
pipelines.main = { vertex = "vs_main", fragment = "fs_main" }
variants.plain = { targets = ["wgsl", "glsl"] }
variants.instanced = { defs = ["INSTANCED"], targets = ["wgsl", "glsl"] }
variants.multi_draw = { defs = ["INSTANCED", "DRAW_INDEX"], targets = ["glsl"] }

# The skinning pass on WebGPU: one thread per vertex of each part of each skinned mesh that a view
# draws, into the skinned vertex buffer that the shadow and main passes draw. VERTEX_TANGENT builds
# the pass for vertex formats with a tangent, and VERTEX_COLOR for those of morphed meshes with a
# color; a build without a bit holds no code for that attribute at all.
[shaders.skin]
file = "skin.wgsl"
by_device = true
variants.webgpu = { permutations = ["VERTEX_TANGENT", "VERTEX_COLOR"], targets = ["wgsl"] }

# A page downloads the skinning pass and every SKIN build with its first skinned mesh. The passes
# leave skinned meshes out until every pipeline that draws or skins them is built.
[first_use.skinning]
shaders = ["skin"]
bits = ["SKIN"]

# A WebGL2 page downloads the MORPH builds with its first morphed mesh. WebGPU morphs in the
# skinning pass, so it has no MORPH builds.
[first_use.morph]
bits = ["MORPH"]

# The depth pyramid of two-phase occlusion culling, a batch of levels per dispatch; its compute
# entry point is `main`. WebGPU only.
[shaders.pyramid]
file = "pyramid.wgsl"
by_device = true
variants.webgpu = { targets = ["wgsl"] }

# A WebGPU page downloads occlusion culling's phases and its depth pyramid when the engine runs
# GPU occlusion culling and the scene first marks an occluder. Until their pipelines are built,
# each camera view culls once, against the frustum alone.
[first_use.occlusion]
shaders = ["cull_occlusion", "pyramid"]

# Light clustering on the GPU: three compute entry points, `count_lights`, `place_lights` and
# `write_lights`, that list each cluster's point and spot lights in the light grid. WebGPU only;
# on WebGL2 the job workers list them.
[shaders.light_clusters]
