[package]
name = "null3d-core"
description = "Scene storage, transforms, culling, animation, spatial queries and the job scheduler."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Native builds (unit tests and tools) park idle job workers on an operating-system futex. The
# WebAssembly builds use the memory.atomic.wait32 instruction instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
atomic-wait = "1.1.0"

[features]
# Test helpers for this crate's tests and other crates' tests: the counting allocator.
testing = []

# The crate's own integration tests use the test helpers.
[dev-dependencies]
null3d-core = { path = ".", features = ["testing"] }

[lints]
workspace = true
